<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UnderDark 营地保卫战 (四塔纯净版)</title>
    <!-- 加载 Tailwind CSS 与 FontAwesome 图标库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!--GAME_STYLE-->
</head>
<body class="flex justify-center items-center h-screen bg-slate-900">
    <div class="game-viewport">
        <!-- 顶部 HUD 控制台 -->
        <header class="p-3 bg-white border-b border-slate-100 flex justify-between items-center z-10 shadow-sm flex-shrink-0 h-16">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-orange-50 border border-orange-200 flex justify-center items-center">
                    <i class="fa-solid fa-shield-halved text-orange-500 animate-pulse text-base"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-500 font-bold tracking-wider uppercase">血量</div>
                    <div class="text-lg font-black text-orange-600 text-glow-orange" id="hp-val">500</div>
                </div>
            </div>
            <div class="text-center w-24">
                <span class="text-xs text-emerald-500 font-bold uppercase tracking-wider block">波次</span>
                <span class="text-lg font-black tracking-widest text-emerald-600 text-glow-green" id="wave-val">第 1 波</span>
            </div>
            <div class="flex items-center gap-2 text-right">
                <div>
                    <div class="text-xs text-slate-500 font-bold tracking-wider uppercase">宝石</div>
                    <div class="text-lg font-black text-amber-500" id="gold-val">250</div>
                </div>
                <div class="w-8 h-8 rounded-lg bg-amber-50 border border-amber-200 flex justify-center items-center">
                    <i class="fa-solid fa-gem text-amber-500 text-base"></i>
                </div>
            </div>
        </header>
        <!-- 战场主画布层：锁定逻辑分辨率，彻底防止塌陷灰屏 -->
        <main class="flex-grow flex-shrink min-h-0 relative overflow-hidden flex items-center justify-center bg-slate-800">
            <!-- 逻辑分辨率 600x920 对应 15 列 x 23 行，每格 40 像素 -->
            <canvas id="gameCanvas" width="600" height="920"></canvas>
            <div id="toast-msg" class="absolute top-4 left-1/2 -translate-x-1/2 bg-white/95 border border-amber-200 px-4 py-2 rounded-full text-xs text-amber-800 shadow-md opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2 z-30">
                <i class="fa-solid fa-circle-exclamation text-amber-500"></i>
                <span id="toast-text">提示信息</span>
            </div>
            <div id="drag-overlay-tip" class="hidden absolute top-12 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-sm text-white px-4 py-1.5 rounded-full text-xs z-30 pointer-events-none flex items-center gap-2">
                <i class="fa-solid fa-hand-pointer animate-bounce"></i>
                <span>拖拽布局中 ⏳ 战局已慢放 10 倍</span>
            </div>
            <!-- 2倍速悬浮按钮（不占用布局，绝对定位右上角） -->
            <button id="speed-btn" onclick="toggleSpeed()" class="absolute top-3 right-3 z-30 w-9 h-9 rounded-full bg-slate-900/70 backdrop-blur-sm text-white text-[10px] font-bold flex items-center justify-center shadow-lg border border-white/20 hover:bg-slate-900/90 transition-all active:scale-90">
                <span id="speed-label">1×</span>
            </button>
            <!-- 塔信息面板（点击塔时显示，游戏暂停；点击框外关闭） -->
            <div id="tower-info-panel" class="hidden absolute inset-0 z-40 flex items-center justify-center p-4 pointer-events-auto" onclick="if(event.target===this) closeTowerInfo()"></div>
            <!-- 三选一词条研习弹窗 -->
            <div id="draft-modal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-center items-center p-6 z-50">
                <div class="bg-white rounded-2xl shadow-2xl p-5 w-full max-w-sm border border-slate-100 flex flex-col gap-4">
                    <div class="text-center">
                        <h3 class="text-base font-bold text-slate-800">🔮 研习全新法术秘籍</h3>
                        <p class="text-[11px] text-slate-400 mt-1">选择一项永久恩赐，同品类全场防御塔生效：</p>
                    </div>
                    <div class="flex flex-col gap-3" id="draft-options-container"></div>
                </div>
            </div>
            <!-- 开场遮罩 -->
            <div id="game-overlay" class="absolute inset-0 bg-white/95 flex flex-col justify-center items-center p-6 text-center z-20 overflow-y-auto">
                <div class="w-20 h-20 bg-emerald-50 rounded-2xl flex items-center justify-center mb-5 border border-emerald-100 shadow-lg shadow-emerald-500/10">
                    <i class="fa-solid fa-wand-magic-sparkles text-emerald-500 text-4xl animate-pulse"></i>
                </div>
                <h1 class="text-2xl font-black tracking-wider text-slate-800 mb-3 uppercase">荒野营地保卫战</h1>
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4 max-w-sm text-left">
                    <div class="text-xs font-black text-slate-700 mb-2 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-book-open text-emerald-500"></i> 核心循环
                    </div>
                    <ul class="text-sm text-slate-600 space-y-2 leading-relaxed">
                        <li class="flex gap-2"><span class="text-emerald-500 font-bold">①</span>拖拽防御塔，阻止怪物抵达守护者</li>
                        <li class="flex gap-2"><span class="text-amber-500 font-bold">②</span>摧毁迷雾解锁部署空间，获取奖励</li>
                        <li class="flex gap-2"><span class="text-rose-500 font-bold">③</span>点击迷雾可锁定，集火优先驱散</li>
                    </ul>
                </div>
                <p class="text-xs text-slate-500 max-w-xs mb-5">快捷键：空格倍速 · D招募 · F词条 · Q取消</p>
                <button onclick="startGame()" class="px-8 py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-base uppercase rounded-xl shadow-lg shadow-emerald-500/30 transition-all active:scale-95">
                    唤醒守护者
                </button>
            </div>
        </main>
        <!-- 底部控制台 -->
        <footer class="bg-white border-t border-slate-100 p-2 flex flex-col gap-1.5 z-10 shadow-[0_-2px_10px_rgba(0,0,0,0.01)] flex-shrink-0 h-44">
            <div class="flex justify-between items-center px-1">
                <span class="text-xs text-slate-500 font-bold tracking-wider uppercase"><i class="fa-solid fa-suitcase mr-1"></i> 手牌</span>
                <span class="text-xs text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded font-bold" id="hand-count">0/5</span>
            </div>
            <div id="hand-cards-container" class="grid grid-cols-5 gap-1.5 min-h-[58px] bg-slate-50 border border-dashed border-slate-200 rounded-xl p-1 flex justify-center items-center">
                <div class="text-xs text-slate-400 col-span-5 text-center py-2.5">手牌为空，点击下方招募</div>
            </div>
            <div class="grid grid-cols-2 gap-2 h-10">
                <button onclick="drawTowerToHand()" class="group relative overflow-hidden bg-white border border-emerald-500/30 hover:border-emerald-500/60 p-1 rounded-xl flex flex-col items-center justify-center transition-all shadow-sm">
                    <div class="flex items-center gap-1 text-emerald-600 font-black text-sm uppercase">
                        <i class="fa-solid fa-plus-circle text-xs"></i> 招募
                    </div>
                    <span class="text-[11px] text-slate-500">消耗 <strong class="text-amber-500 font-bold" id="cost-tower-val">10</strong>💎</span>
                </button>
                <button onclick="startAffixDraft()" class="group relative overflow-hidden bg-white border border-indigo-500/30 hover:border-indigo-500/60 p-1 rounded-xl flex flex-col items-center justify-center transition-all shadow-sm">
                    <div class="flex items-center gap-1 text-indigo-600 font-black text-sm uppercase">
                        <i class="fa-solid fa-scroll text-xs"></i> 研习
                    </div>
                    <span class="text-[11px] text-slate-500">消耗 <strong class="text-amber-500 font-bold" id="cost-affix-val">100</strong>💎</span>
                </button>
            </div>
            <div class="bg-slate-50 border border-slate-200/50 rounded-xl p-1.5 overflow-hidden flex-grow flex flex-col">
                <button onclick="toggleCodex()" class="w-full flex justify-between items-center text-xs text-slate-600 font-bold uppercase tracking-wider">
                    <span><i class="fa-solid fa-book-open mr-1 text-indigo-500"></i> 全局强化</span>
                    <i id="codex-caret" class="fa-solid fa-caret-up transition-transform duration-300"></i>
                </button>
                <div id="codex-panel" class="hidden mt-1 flex-grow overflow-y-auto custom-scroll text-[11px] divide-y divide-slate-200/60">
                    <div class="py-1 text-slate-400 italic text-center">暂未获得任何全局强化效果。</div>
                </div>
            </div>
        </footer>
    </div>
    <!-- 游戏配置数据（构建时由 src/data/*.json 生成） -->
    <!--GAME_DATA-->
    <!-- 游戏模块（分享版：构建时按 src/js/build-order.json 顺序内联；开发版：直接引用 src/js/ 散装文件） -->
{{INLINE_SCRIPTS}}
</body>
</html>
