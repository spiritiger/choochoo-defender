<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>哐当哐当守卫战 · 迷你演示</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="app">
    <header id="hud">
      <div class="hud-cell"><span class="hud-key">金币</span><span id="hudGold" class="hud-val">0</span></div>
      <div class="hud-cell"><span class="hud-key">车斗</span><span id="hudCargo" class="hud-val">0</span></div>
      <button id="btnExport" class="hud-btn" title="复制当前地图数据（调试用）">导出地图</button>
      <button id="btnForce" class="hud-btn" title="放开求解时间预算重算铁轨（界面会暂时卡住）">强制刷新</button>
    </header>

    <div id="fieldWrap">
      <canvas id="game"></canvas>
    </div>

    <footer id="footer">
      <div id="cards"></div>
      <div class="actionRow">
        <button id="btnRoll" class="btn">重抽</button>
        <button id="btnDepart" class="btn">发车</button>
      </div>
      <div id="status"></div>
    </footer>
  </div>
</div>

<script src="js/config/map.js"></script>
<script src="js/state.js"></script>
<script src="js/station.js"></script>
<script src="js/clock.js"></script>
<script src="js/transport.js"></script>
<script src="js/engine.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
