<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>哐当哐当守卫战 · 迷你演示</title>
<!-- ============================================================
     单文件版（自动生成，请勿手动编辑）
     样式与脚本已全部内联，双击即可运行，也可作为单个文件发送他人。
     源码结构版：index.html（改代码请改那边，然后重新运行 build_single.js）
     ============================================================ -->
<style>
:root {
  --brand:#4B3FE3;
  --bg:#14161d;
  --panel:#1e2130;
  --panel2:#2a2e42;
  --line:rgba(255,255,255,0.08);
  --text:#e8ebf4;
  --muted:#9aa0b4;
  --gold:#f0b429;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; padding:0; height:100%; background:#0b0c12; overflow:hidden;
  font-family:"SF Pro Text","PingFang SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text); -webkit-user-select:none; user-select:none; touch-action:manipulation; }

#stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#app { position:relative; width:390px; height:844px; background:var(--bg);
  transform-origin:center center; box-shadow:0 0 40px rgba(0,0,0,0.5); }

/* HUD */
#hud { height:52px; display:flex; align-items:center; justify-content:space-around;
  background:var(--panel); border-bottom:1px solid var(--line); }
.hud-cell { display:flex; flex-direction:column; align-items:center; line-height:1; }
.hud-key { font-size:11px; color:var(--muted); margin-bottom:4px; }
.hud-val { font-size:18px; font-weight:700; }
/* 注意：#hudGold 自身就是那个 .hud-val span，后代选择器永远匹配不到，金币数字不会是金色 */
#hudGold { color:var(--gold); }
/* 车斗（v0.9.2）：车上堆着、还没入账的金币 —— 用列车同色系（浅紫）与已入账的金币区分 */
#hudCargo { color:#8f86ff; }
.hud-btn { height:30px; padding:0 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--muted); font-size:12px; cursor:pointer; }
.hud-btn:active { color:var(--text); border-color:var(--brand); }

/* Field */
/* v1.6.38 作战拉远：fieldWrap = HUD 以下**全部**（792 = 844-52），画布物理高度同步；
   白天 footer（absolute，高 = CFG.FOOTER_H，v1.6.39 由 232 压到 148——status 提示行
   退役）遮住画布下部；夜晚 footer 淡出 ⇒ 全画布可见，LAY 切 battleLayout（缩小居中）*/
#fieldWrap { position:relative; height:792px; background:var(--bg); overflow:hidden; }
#game { position:absolute; left:0; top:0; display:block; touch-action:none; }

/* Footer */
#footer { position:absolute; left:0; right:0; bottom:0; height:148px; background:var(--panel);
  border-top:1px solid var(--line); padding:8px 12px; display:flex; flex-direction:column;
  transition:opacity .5s ease; }              /* v1.6.39 作战拉远平滑过渡：淡出而非硬切 */
#footer.battle-hidden { opacity:0; pointer-events:none; }   /* 夜晚拉远：藏 + 防误触 */
/* 【死代码 v1.6.33 清出】这里原有 #cards / .card / .c-* / .shapePrev（v1.4 之前的旧"抽卡
   三选一大卡"样式）。index.html 自 v1.4 起就没有 #cards 容器了，一直没被引用 ——
   原文已备份到本文件末尾的注释块（无 VCS，留档备查）。
   【v1.6.39 退役】#status 行样式随元素一并删除（提示行退役，见 ui.js setStatus 注释）。 */
.actionRow { display:flex; gap:8px; margin-top:6px; }
.btn { flex:1; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--panel2);
  color:var(--text); font-size:14px; font-weight:600; cursor:pointer; }
.btn:disabled { opacity:.45; cursor:default; }

/* ---- v1.3-rc 塔防迭代 ---- */
/* 挑战失败遮罩：盖住整个 app，只留重开按钮 */
#overOverlay { position:absolute; inset:0; background:rgba(10,10,16,0.82); z-index:10;
  display:flex; align-items:center; justify-content:center; }
#overOverlay.hidden { display:none; }
#overBox { text-align:center; }
#overTitle { font-size:30px; font-weight:800; color:#e8563f; margin-bottom:10px; }
#overWave { font-size:14px; color:var(--muted); margin-bottom:22px; }
#overBox .btn { width:160px; }
/* v1.7.0 关卡通关弹层（§14.62）：配色与失败层同构，绿调表"过" */
#winOverlay { position:absolute; inset:0; background:rgba(10,10,16,0.82); z-index:10;
  display:flex; align-items:center; justify-content:center; }
#winOverlay.hidden { display:none; }
#winBox { text-align:center; }
#winTitle { font-size:30px; font-weight:800; color:#58c98a; margin-bottom:10px; }
#winInfo { font-size:14px; color:var(--muted); margin-bottom:22px; }
#winBox .btn { width:160px; margin-bottom:10px; }
#winBox .winRow { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
#winBox .winRow .btn { width:110px; margin-bottom:0; }
/* v1.7.0 失败层追加的「回随机模式」（关卡模式才显示） */
#overBox #btnOverRandom { display:none; margin-top:10px; }
#overBox.lv #btnOverRandom { display:block; }
/* v1.7.0 工具菜单「关卡模式」区块（§14.62）：当前模式高亮、锁定关禁用 */
#modeArea { border-top:1px solid var(--line); margin-top:4px; padding-top:12px; }
#modeTitle { font-size:13px; font-weight:700; color:var(--muted); margin-bottom:8px; }
#modeArea .menuRow .btn.lvBtn { max-width:none; font-size:12px; padding:0 2px; }
.lvBtn.active { border-color:var(--brand); color:var(--brand); }
.lvBtn:disabled { opacity:.35; }
#modeHint { min-height:16px; font-size:11px; color:var(--muted); margin:-2px 0 8px; }
/* ---- v1.4 卡牌大改（v1.6.33 大王令重订版式）----
   底部牌库：持有的卡，拖到场上使用。
   ▍版式统一 = **顶部形状样式 / 中间名字 / 下面描述**，三类卡同一套三行结构、**全卡统一字号**。
   ▍不再顶破屏幕：卡数多时 `overflow-x:auto` 横向滑动，卡 `flex:0 0 auto` 不收缩
     （5 张及以上会溢出，靠滑动看全）。触摸端横滑由 ui.js `startDeckDrag` 的
     "手势轴锁定"手动驱动 scrollLeft —— 卡上 `touch-action:none` 要留给"拖到场上"。*/
#deckRow { display:flex; gap:8px; min-height:78px; margin-top:8px; align-items:stretch;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.22) transparent; }
#deckRow::-webkit-scrollbar { height:4px; }
#deckRow::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.22); border-radius:2px; }
#deckRow::-webkit-scrollbar-track { background:transparent; }
.pcard { flex:0 0 auto; width:84px; border:1px solid var(--line); border-radius:8px;
  background:var(--panel2); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; cursor:grab; touch-action:none; padding:5px 3px; }
.pcard:active { cursor:grabbing; border-color:var(--brand); }
#deckEmpty { flex:1; display:flex; align-items:center; justify-content:center;
  font-size:11px; color:var(--muted); }

/* 卡面三行：牌库小卡(.p-*) 与弹层大卡(.o-*) 共用同一套结构 + **同一字号 12px** */
.pcard .p-name, .oc .o-name { font-size:12px; font-weight:700; line-height:1.15; text-align:center; }
.pcard .p-desc, .oc .o-desc { font-size:12px; line-height:1.15; color:var(--muted);
  text-align:center; padding:0 2px; }
/* v1.6.37 大王令"卡牌放大，词条文本挤"：弹层大卡单独放宽行距（词条 land 文案长，
   3~4 行才放得下）；牌库小卡文案短，行距不动 */
.oc .o-desc { line-height:1.5; padding:0 4px; }
.pcard .p-shape, .oc .o-shape { display:grid; gap:1px; }
.pcard .p-shape i { width:6px; height:6px; border-radius:1px; background:var(--brand); }
.oc .o-shape i { width:10px; height:10px; border-radius:1px; background:var(--brand); }
.pcard .p-art, .oc .o-art { display:flex; align-items:center; justify-content:center; height:16px; }
.oc .o-art { height:28px; }
/* 顶部"形状样式"图形（与 renderer 的形状互斥口径一致）：塔 = 六边形 / 建筑 = 方块 */
.art-hex { display:block; width:16px; height:16px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
.art-sq { display:block; width:15px; height:15px; border-radius:2px; }
.oc .art-hex { width:26px; height:26px; }
.oc .art-sq { width:24px; height:24px; }
/* v1.6.34 词条卡图形 = 菱形（与塔六边形/建筑方块互斥） */
.art-dia { display:block; width:13px; height:13px; transform:rotate(45deg); border-radius:2px; }
.oc .art-dia { width:22px; height:22px; }
/* v1.6.35 建筑范围图：3×3 地块，中心建筑本色、周围范围淡色（军工厂四角隐藏成十字） */
.p-range, .o-range { display:grid; gap:1px; }
.pcard .p-range i { display:block; width:5px; height:5px; border-radius:1px; }
.oc .o-range i { display:block; width:9px; height:9px; border-radius:1px; }

/* 三选一弹层 */
#offerOverlay { position:absolute; inset:0; background:rgba(10,10,16,0.85); z-index:11;
  display:flex; align-items:center; justify-content:center; }
#offerOverlay.hidden { display:none; }

/* ---- v1.6.67 工具菜单弹层（大王令：工具类功能统一收纳，点击暂停游戏）---- */
#menuOverlay { position:absolute; inset:0; background:rgba(10,10,16,0.85); z-index:12;
  display:flex; align-items:center; justify-content:center; }
#menuOverlay.hidden { display:none; }
#menuBox { width:300px; padding:18px 16px; border:1px solid var(--line); border-radius:14px;
  background:var(--panel); text-align:center; }
#menuTitle { font-size:18px; font-weight:800; margin-bottom:14px; }
#menuBox .menuRow { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
#menuBox .menuRow .btn { flex:1; max-width:130px; }
#importText { width:100%; height:110px; resize:vertical; font-size:11px; line-height:1.4;
  font-family:Consolas,monospace; color:var(--text); background:var(--panel2);
  border:1px solid var(--line); border-radius:8px; padding:6px; box-sizing:border-box; }
#menuHint { min-height:18px; font-size:12px; color:var(--muted); margin:4px 0 10px; }
#menuHint.err { color:#e8563f; }
#menuHint.ok { color:#58c98a; }
#menuBox #btnMenuClose { width:160px; }
#offerBox { text-align:center; }
#offerTitle { font-size:18px; font-weight:800; margin-bottom:20px; }
/* v1.6.37 放大：3×116 + 2×10 = 368 ≤ 390（画布宽），三卡不溢出 */
#offerCards { display:flex; gap:10px; justify-content:center; }
.oc { position:relative; width:116px; height:176px; border:1px solid var(--line); border-radius:12px;
  background:var(--panel2); display:flex; flex-direction:column; align-items:center;
  justify-content:center; cursor:pointer; gap:6px; padding:8px 6px; }
.oc:active { border-color:var(--brand); box-shadow:0 0 0 2px var(--brand); }
/* 【退役 v1.6.73】快捷键 1/2/3 角标（v1.6.61 加，大王令撤视觉提示；快捷键本身
   保留，选择器不再被任何 DOM 使用，保留备查（无 VCS，删了就找不回）。*/
/* .oc .oc-key { position:absolute; top:5px; left:5px; width:18px; height:18px; line-height:18px;
  text-align:center; font-size:11px; font-weight:800; color:#fff; background:var(--brand);
  border-radius:50%; opacity:.9; } */

/* 【退役 v1.6.33】旧三选一卡面（.o-kind/.o-main/.o-sub 与 .p-kind）已被上面的
   统一三行版式取代，选择器不再被任何 DOM 使用，保留备查（无 VCS，删了就找不回）。*/
/* .oc .o-kind{font-size:11px;color:var(--muted)} .oc .o-main{font-size:15px;font-weight:800}
   .oc .o-sub{font-size:10px;color:var(--muted)} .pcard .p-kind{font-size:10px;color:var(--muted)} */
/* 【退役 v1.4】旧"抽卡三选一大卡"（#cards/.card/.c-*）与 .shapePrev —— 自 v1.4 起
   index.html 已无 #cards 容器，这套样式一直没被引用（v1.6.33 复核确认死代码，保留备查）。*/
/* #cards{display:flex;gap:8px;flex:1 1 auto;min-height:0}
   .card{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--panel2);
     display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
   .card .c-name{font-size:13px;font-weight:600;margin-top:6px}
   .card .c-meta{font-size:11px;color:var(--muted);margin-top:3px;text-align:center;padding:0 4px}
   .card.selected{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
   .card .c-ico{font-size:22px;line-height:1}
   .card .shapePrev{position:relative;min-height:24px}
   .card .shapePrev i{position:absolute;width:10px;height:10px;border-radius:2px;
     background:var(--brand);box-shadow:0 0 0 1px rgba(0,0,0,0.25) inset} */

</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <header id="hud">
      <div class="hud-cell"><span class="hud-key">金币</span><span id="hudGold" class="hud-val">0</span></div>
      <!-- v1.4.7：HUD「车斗」格子退役（大王定"冗余"）—— 车上浮字 +N 仍实时显示车斗量 -->
      <div class="hud-cell"><span class="hud-key">城墙</span><span id="hudCore" class="hud-val">100</span></div>
      <div class="hud-cell"><span class="hud-key">波次</span><span id="hudWave" class="hud-val">-</span></div>
      <button id="btnSpeed" class="hud-btn" title="游戏倍速循环 ×1→×2→×4；本会话内保持，关掉网页重置">×1</button>
      <!-- v1.6.67（大王令）：导出地图/导出记录/强制刷新 收编进【菜单】弹层，右上角只留一个入口 -->
      <button id="btnMenu" class="hud-btn" title="工具菜单：导入/导出地图、导出记录、强制刷新">菜单</button>
    </header>

    <div id="fieldWrap">
      <canvas id="game"></canvas>
    </div>

    <footer id="footer">
      <div class="actionRow">
        <!-- v1.4 卡牌大改：清理按钮退役；抽塔 → 抽卡（三选一）。
             v1.4.5：撤销清理回归左下角（回撤最近一次形状卡清理，救路径规划失败）。
             牌库 deckRow 由 ui.js 动态渲染（形状卡/英雄卡，拖到场上使用） -->
        <button id="btnUndo" class="btn" title="回撤最近一次形状卡清理（废墟还原，卡回牌库）">撤销清理</button>
        <button id="btnDepart" class="btn">开波</button>
        <button id="btnSummon" class="btn">抽卡(5)</button>
      </div>
      <div id="deckRow"></div>
      <!-- v1.6.39：#status 提示行已退役（大王令"已入牌库之类的提示文本没有必要"），
           footer 随之压缩 232 → 148 -->
    </footer>

    <!-- 三选一弹层（v1.4）：点【抽卡】→ 发三张卡 → 必须选一张进牌库 -->
    <div id="offerOverlay" class="hidden">
      <div id="offerBox">
        <div id="offerTitle">抽卡 · 三选一</div>
        <div id="offerCards"></div>
      </div>
    </div>

    <!-- 工具菜单弹层（v1.6.67 大王令）：导入/导出地图、导出记录、强制刷新统一收纳；
         点击暂停游戏，关闭恢复。之后新增工具类功能也放这里 -->
    <div id="menuOverlay" class="hidden">
      <div id="menuBox">
        <div id="menuTitle">工具菜单</div>
        <div class="menuRow">
          <button id="btnExport" class="btn" title="复制当前地图数据（调试用）">导出地图</button>
          <button id="btnLog" class="btn" title="复制本次行为记录（JSON 流水，供统计与平衡数值）">导出记录</button>
        </div>
        <div class="menuRow">
          <button id="btnForce" class="btn" title="放开求解时间预算重算铁轨（界面会暂时卡住）">强制刷新</button>
        </div>
        <!-- v1.6.70：粘贴区常驻（大王拍板 A 案）——砍掉【导入地图】按钮与展开状态机，零点击直达 -->
        <div id="importArea">
          <textarea id="importText" spellcheck="false"
            placeholder="要复刻盘面就粘导出数据，不用可无视"></textarea>
          <button id="btnImportGo" class="btn">确认导入</button>
        </div>
        <!-- v1.7.0 关卡模式（§14.62 大王令）：随机（默认）/ 固定线性关卡 5 关，
             两步确认防误触丢局，生效即重开新局 -->
        <div id="modeArea">
          <div id="modeTitle">关卡模式</div>
          <div class="menuRow">
            <button id="btnModeRandom" class="btn" title="随机生成地图，无限波次（默认）">随机模式</button>
          </div>
          <div class="menuRow" id="levelBtnRow">
            <button class="btn lvBtn" data-lv="0" title="第 1 关 · 双轴">第1关</button>
            <button class="btn lvBtn" data-lv="1" title="第 2 关 · 外郭">第2关</button>
            <button class="btn lvBtn" data-lv="2" title="第 3 关 · 四缘">第3关</button>
            <button class="btn lvBtn" data-lv="3" title="第 4 关 · 环心">第4关</button>
            <button class="btn lvBtn" data-lv="4" title="第 5 关 · 边陲">第5关</button>
          </div>
          <div id="modeHint"></div>
        </div>
        <div id="menuHint"></div>
        <button id="btnMenuClose" class="btn">关闭</button>
      </div>
    </div>

    <!-- 关卡通关弹层（v1.7.0）：清完第 10 波收车 → 通关（§14.62） -->
    <div id="winOverlay" class="hidden">
      <div id="winBox">
        <div id="winTitle">关卡完成</div>
        <div id="winInfo">-</div>
        <div class="winRow">
          <button id="btnNextLevel" class="btn">下一关</button>
          <button id="btnReplayLevel" class="btn">重打本关</button>
        </div>
        <button id="btnWinRandom" class="btn">回随机模式</button>
      </div>
    </div>

    <!-- 挑战失败遮罩（v1.3-rc）：镇中心血量归零 → 锁全部操作，只留重开；
         v1.7.0 关卡模式加「回随机模式」，按钮文案改「重打本关」 -->
    <div id="overOverlay" class="hidden">
      <div id="overBox">
        <div id="overTitle">镇中心陷落</div>
        <div id="overWave">坚守波次：-</div>
        <button id="btnRestart" class="btn">重新开始</button>
        <button id="btnOverRandom" class="btn">回随机模式</button>
      </div>
    </div>
  </div>
</div>

<!-- 加载序 = 依赖序（v1.3-rc 新增 towers/foes：state 之后、clock 之前；
     运行时才互调，无加载环。v1.3.5 新增 log：零依赖行为记录器，放 config 之后。
     改顺序前先看 docs/设计规格.md §12/§13 -->
<script>
/* ===== js/config/map.js ===== */
// 地图布局与网格 / 俄罗斯方块清理形状
window.CFG = {
  CANVAS_W: 390,
  CANVAS_H: 844,
  HUD_H: 52,
  FOOTER_H: 148,      // v1.6.39 大王令：232→148（#status 提示行退役 + 区域压缩）；
                      //   白天 fieldH 642 ⇒ cell 仍由宽度瓶颈决定恒 41，白天布局几何不变
  MAP_COLS: 9,        // v1.3.6 曾改 7，同日回退：7×11 上 5×7 圈占全图 45%，金币全挤外圈贴边，体验差
  MAP_ROWS: 13,       // （同上，回退 9×13）
  TRAIN_SPEED: 2.6,   // 格/秒
  GOLD_RATE: 5,       // 列车驶入金币地块 +5 金币（2026-10-18 大王令 10→5；十字格一圈只算一次）
  MINT_BONUS: 1,      // 每覆盖一座【铸币所】，覆盖金币格拾取**枚数** +1（1枚→2枚，金额=枚数×GOLD_RATE；v1.8u 三拍板「数量+1 非价值+1」，§14.82）
  // 【经验】波次总经验表（v1.8v 大王令 2026-10-20，§14.90；沿革 v1.8u 四拍板）：击杀经验 =
  //   波总额按本波怪数均分（EXP.killGain）；w>10 封顶取最后一项（关卡模式 LEVEL_WAVES=10）。
  //   设计口径：前 2 波合计 3300 < L1→L2 的 3500（不够升级）；第 3~10 波每波恰升 1 级，
  //   10 波打完到 L9（累计 39700，落在 [36400, 42300) 区间内）。
  WAVE_EXP: [1500, 1800, 3500, 3800, 4100, 4400, 4700, 5000, 5300, 5600],
  MINT_RANGE: 1,      // 【铸币所】作用半径（格，切比雪夫）：1 ⇒ 3×3（v1.8u 大王令「与加油站一致」，与 GAS_RANGE 同值独立）
  GAS_RANGE: 1,       // 【加油站】作用半径（格，切比雪夫）：1 ⇒ 3×3
  GAS_STEP: 1,        // 每座覆盖车头的【加油站】+1 倍速（大王拍板：**求和**不连乘，两座 = 3×）
  // 【消耗提速】（v1.8y 大王拍板 2026-10-21，替换 §14.91 资源点方案；**同日改版**——
  //   大王拍板「每次抽卡进度+1、每 4 抽 1 级、最多 8 级」）：
  //   进度源 = GS.drawCount（本局已付费抽卡次数），抽满 4 抽跨一档 → 列车永久提速
  //   一档（每档 +SPEND_SPEED_STEP），档数 = 表长，全拿封顶 +80%（1.8×）。
  //   与加油站提速、奖励时间快进独立乘区相乘。造塔走同一扣费入口 GS.spendGold
  //   但不动 drawCount ⇒ 重算幂等、不计进度（仅抽卡计次，大王拍板）。
  SPEND_SPEED_TIERS: [4, 8, 12, 16, 20, 24, 28, 32],   // 累计抽卡次数阈值（每 4 抽一档）
  SPEND_SPEED_STEP: 0.10,   // 每跨一档 +10% 车速
  // 【猛攻坊/疾速坊】（v1.8u 十三令，§14.84 大王令）：军工厂（FACTORY_*）退役。
  //   猛攻坊 = 同行**左右各一格**的车厢建筑攻击 +100%/座；疾速坊 = 同列**上下各一格**
  //   的车厢建筑攻速 +100%/座——均**求和非连乘**、无上限；攻速消费 = 间隔 ÷(1+加成)
  //   （+300% ⇒ ÷4 = 间隔 −75%，大王锚点）。查询式口径与 GAS_STEP 同族。
  AUX_ATK: 1.0,       // 每座【猛攻坊】：左右邻格车厢攻击 +100%
  AUX_ASP: 1.0,       // 每座【疾速坊】：上下邻格车厢攻速 +100%（间隔 ÷(1+加成)）
  GOLD_TILES: 10,     // 开局金币地块数量（v1.6.24 大王令 14→10；沿革：10 → 7(v0.6.14) → 14(v0.6.15) → 7(v1.3.6 随 7×11) → 14 回退 → 10）
  HEART_TILES: 5,     // 开局爱心地块数量（v1.6.22 大王令：5 枚）
  HEART_HEAL: 2,      // 每枚爱心送到站台回血点数（v1.6.22）
  HEART_OUTER: 4,     // 其中落在「地图最外一圈」的枚数，其余落 5×7 之外的中圈（大王令"外圈占比更高"）
  RES_GAP: 2,         // 资源格最小间距（切比雪夫）：金币与爱心共用一套撒点规则，3×3 邻域内不许有第二枚
  CORE_HP: 100,       // 镇中心初始血量（v1.4.8 大王令 60→100；跨波继承不重置，归零失败）
  STATION_BONUS: 5    // 到站交付额外 +5 金币（2026-10-18 大王令 10→5；v1.3-rc 拍板 ④"站台一定给金币"）
};

CFG.inBounds = function (c, r) { return c >= 0 && c < CFG.MAP_COLS && r >= 0 && r < CFG.MAP_ROWS; };

// 场地区高度（HUD/底部面板为 HTML，画布仅覆盖此区域）
CFG.fieldH = function () { return CFG.CANVAS_H - CFG.HUD_H - CFG.FOOTER_H; };
// 作战拉远可视高（v1.6.38 大王令"作战时镜头拉远，底部UI不可见"）：
//   画布物理上一直 = HUD 以下全部（792），白天只是被 footer（absolute）盖住下部；
//   夜晚 footer 隐藏 ⇒ 全画布可见，地图用 battleLayout 重算居中。
CFG.battleFieldH = function () { return CFG.CANVAS_H - CFG.HUD_H; };

// 画布内地图布局（day/battle 共用一个几何内核，只有可视高/格子尺寸不同）
//   maxCell（v1.6.39）：可选格子尺寸上限 —— 作战拉远时**真缩小**格子（不是只平移），
//   地图变小居中、四周留出荒野带，敌人从地图边缘冒出 = "从城镇外杀进来"。
CFG._layout = function (fieldH, maxCell) {
  var availW = CFG.CANVAS_W - 16;
  var availH = fieldH - 24;   // v1.3.6：留白 64 → 24（9×13 下格子 38 → 41px，地图更饱满）
  var cell = Math.floor(Math.min(availW / CFG.MAP_COLS, availH / CFG.MAP_ROWS));
  if (maxCell) cell = Math.min(cell, maxCell);   // v1.6.39 拉远缩小上限
  var w = cell * CFG.MAP_COLS;
  var h = cell * CFG.MAP_ROWS;
  return {
    cell: cell,
    x: Math.floor((CFG.CANVAS_W - w) / 2),
    y: Math.floor((fieldH - h) / 2),
    w: w, h: h
  };
};
CFG.layout = function () { return CFG._layout(CFG.fieldH(), CFG.BUILD_CELL); };
// 白天建造布局格子上限（v1.6.53 大王令"建造区域稍微缩小一点点，避免侧面的预警
//   UI 遮挡地块"）：cell 41→**37**（地图 333×481，左右荒野各 ~28px）—— 侧向降级
//   预警（小圈 sr≈10 + 边距）恰好落在荒野带内，不压地块。沿革：此前由宽度瓶颈
//   决定恒 41（v1.6.40 起 fieldH 642 上下也不缺）。
CFG.BUILD_CELL = 37;
// 作战布局（v1.6.39 大王二令"不是平移，要缩小；敌人从城镇外的荒野冒出来"；
//   v1.6.42 大王三令"荒野应该更大而非环绕一圈"）：cell 由 41 压到 **28**
//   （9×13：372×533 → 252×364，缩小 32%），地图在全画布（792）居中，
//   上下各留 ~214px、左右 ~69px 大片荒野 —— "城镇"只是荒野包围中的一块被
//   围墙圈起来的地，怪从地图边缘（荒野深处）生成杀进来。renderer 画荒野暗角
//   + 城镇边界描边 + 全荒野撒草石（REND.wilderness），过渡动画由 main.js CAM 驱动。
CFG.BATTLE_CELL = 28;
CFG.battleLayout = function () { return CFG._layout(CFG.battleFieldH(), CFG.BATTLE_CELL); };
CFG.ccx = function (L, c) { return L.x + c * L.cell + L.cell / 2; };
CFG.ccy = function (L, r) { return L.y + r * L.cell + L.cell / 2; };
CFG.pickCell = function (L, mx, my) {
  var c = Math.floor((mx - L.x) / L.cell);
  var r = Math.floor((my - L.y) / L.cell);
  return CFG.inBounds(c, r) ? { c: c, r: r } : null;
};

// 俄罗斯方块清理形状（v0.6.9 大王定案）：**矩形**，面积 4/6/8 三档等概率。
// 流程 = 等概率选面积 → 等概率选拆法 → 随机横竖朝向。名字记作「宽×高」
//   （2×3 与 3×2 是同一个形状的两种朝向，`GS.cardSig` 会把它们归成同一"尺寸家族"）。
// ⚠️ 目前每档**只有一种拆法**，所以 randomShape 里"选拆法"那步实际恒取第 0 项 ——
//    这不是 bug，是**刻意保留的数组结构**：将来想给某档加第二种拆法，
//    只需在这里补一行，randomShape 不用动。别把它简化成标量。
CFG.SHAPE_SIZES = [4, 6, 8];
CFG.SHAPE_RECTS = {
  4: [[2, 2]],
  6: [[2, 3]],
  8: [[2, 4]]
};

// 随机生成一个清理形状：{ name, cells }，cells 已归一化（最小坐标归 0）
// 可选传 size（4/6/8）指定面积档位；不传则三档等概率随机。
CFG.randomShape = function (size) {
  if (size === undefined) size = CFG.SHAPE_SIZES[Math.floor(Math.random() * CFG.SHAPE_SIZES.length)];
  var opts = CFG.SHAPE_RECTS[size];
  var rc = opts[Math.floor(Math.random() * opts.length)];
  var w = rc[0], h = rc[1];
  if (Math.random() < 0.5) { var t = w; w = h; h = t; }    // 随机横竖
  var cells = [];
  for (var r = 0; r < h; r++) for (var c = 0; c < w; c++) cells.push([c, r]);
  return { name: w + '×' + h, cells: cells };
};
</script>
<script>
/* ===== js/log.js ===== */
// ============================================================================
// 行为记录模块（v1.3.5）—— 玩家操作流水，用于后续统计与数值平衡
//
// 大王拍板（2026-09-29）：顶栏新增【导出记录】按钮（导出地图旁），复制本次
//   玩家行为的 JSON 行流水。记录范围（拍板：施工/经济/战斗三类，铁轨重算不记）：
//   · 施工：cleanPay（抽形状付费）/ cleanApply / cleanFail（清理成败与原因）/
//     cleanDiscard（形状作废）/ cleanUndo（撤销清理，v1.4.5）/ buildHero（英雄卡建造）/
//     buildBuilding / buildCancel（v1.6.23：建筑卡落位 / 取消收回）/
//     buildMove / buildSwap / buildRecall（v1.8u 十四令 §14.85：场上建筑移动 /
//     交换 / 下场变卡）/ heroCancel（英雄卡拖空或非法位收回，v1.4.10）/ summon /
//     summonFail / merge / mergeFail
//   · 经济：waveStart（带金币快照）/ waveEnd / deliver（车斗+站台分项、结余、爱心数）
//     / heal（v1.6.22：到站交付爱心回血后的血量快照）
//   · 战斗：coreHit（镇中心每次受伤后的血量）/ gameOver / newGame（含重开）
//
// 设计口径：
//   · t = 页面加载起的秒数（performance.now 基准，0.1s 精度）——跨局连续递增，
//     靠 newGame 事件切分局；绝对时刻看头部 ISO 时间戳。
//   · 环形上限 LOG.CAP（默认 3000 条，超出丢最旧）——十几局也撑不爆内存。
//   · 各模块调用一律 typeof 守卫（与 CLOCK/STATION 同约定）：test 沙箱不载
//     log.js 时零开销跳过。
//   · 本模块零依赖，index.html 里排在 config 之后即可。
// ============================================================================
window.LOG = {};

LOG.VER = 'v1.7.8c';   // 记录器数据格式版本（随规格版本更新；头部 # ver= 行用它）
LOG.CAP = 3000;   // 环形上限：超出丢弃最旧事件
LOG.buf = [];     // 事件缓冲：{t, ev, ...附加字段}
LOG._t0 = (typeof performance !== 'undefined' && performance.now)
  ? performance.now() : Date.now();    // 页面加载基准（脚本执行时近似）
// 会话 ID（页面加载时生成一次，6 位 base36）：多份日志汇总统计时区分数据来源
LOG.sid = (function () {
  var s = '';
  while (s.length < 6) s += Math.random().toString(36).slice(2);
  return s.slice(0, 6);
})();

// 页面相对秒（0.1s 精度）
LOG.now = function () {
  var src = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  return Math.round((src - LOG._t0) / 100) / 10;
};

// 形状家族归一（v1.3.5 补充，大王拍板）：把「宽×高」按边长排序成规范名，
//   使 2×3 / 3×2（同形状的横竖朝向）归并到同一个家族名 —— 聚合统计不再拆成两行。
//   非「数字×数字」格式的名字原样返回（防御）。
LOG.shapeFam = function (name) {
  var m = /^(\d+)×(\d+)$/.exec(String(name));
  if (!m) return name;
  var a = +m[1], b = +m[2];
  return a <= b ? a + '×' + b : b + '×' + a;
};

// 记一条事件。ev = 事件名；data = 附加字段对象（可省略）。返回该条目。
//   data 里带 shape 的（清理三兄弟）自动补 fam = 家族名 —— 调用点不用各自管。
LOG.add = function (ev, data) {
  var e = { t: LOG.now(), ev: ev };
  if (data) {
    for (var k in data) e[k] = data[k];
    if (data.shape) e.fam = LOG.shapeFam(data.shape);
  }
  LOG.buf.push(e);
  while (LOG.buf.length > LOG.CAP) LOG.buf.shift();   // 环形：丢最旧
  return e;
};

LOG.count = function () { return LOG.buf.length; };

// 导出文本：头部 + 两行汇总 + 每事件一行 JSON（与导出地图同走剪贴板，ui.js 调）。
LOG.exportText = function () {
  var stat = {}, runs = 0, maxWave = 0, goldEarned = 0, i, e;
  for (i = 0; i < LOG.buf.length; i++) {
    e = LOG.buf[i];
    stat[e.ev] = (stat[e.ev] || 0) + 1;
    if (e.ev === 'newGame') runs++;
    if (e.ev === 'waveStart' && e.wave > maxWave) maxWave = e.wave;
    if (e.ev === 'deliver') goldEarned += (e.got || 0);
  }
  var lines = ['KDG-LOG v1 ' + new Date().toISOString()];
  lines.push('# ver=' + LOG.VER + ' sid=' + LOG.sid);
  lines.push('# 事件 ' + LOG.buf.length + ' 条（上限 ' + LOG.CAP + '，超出丢最旧）· 开局 ' + runs + ' 次');
  lines.push('# 统计: waves=' + maxWave +
    ' clean=' + (stat.cleanApply || 0) + '+' + (stat.cleanFail || 0) + 'fail' +
    '+' + (stat.cleanDiscard || 0) + 'discard' +
    ' summon=' + (stat.summon || 0) + '+' + (stat.summonFail || 0) + 'fail' +
    ' hero=' + (stat.buildHero || 0) + '+' + (stat.heroCancel || 0) + 'cancel' +
    ' merge=' + (stat.merge || 0) + '+' + (stat.mergeFail || 0) + 'fail' +
    ' deliver=' + (stat.deliver || 0) + ' goldEarned=' + goldEarned +
    ' coreHit=' + (stat.coreHit || 0) + ' gameOvers=' + (stat.gameOver || 0));
  for (i = 0; i < LOG.buf.length; i++) lines.push(JSON.stringify(LOG.buf[i]));
  return lines.join('\n');
};

<script>
/* ===== js/state.js ===== */
// 全局游戏状态：地块地形 / 经济建筑 / 动态铁轨环 / 三选一
window.GS = {};

GS.newGame = function () {
  GS.gold = 30;   // v1.3.1：初始金币 120 → 30（大王拍板；开局空地仅 2 格，清废墟成为前期核心决策）

  GS.buildings = [];

  // grid[r][c] = { t: 'blank'|'rubble', gold: 是否金币地块, heart: 是否爱心地块,
  //                harvested: 本圈是否已收过（金币/爱心共用一个标记，二者互斥）, b: building|null }
  GS.grid = [];
  for (var r = 0; r < CFG.MAP_ROWS; r++) {
    var row = [];
    for (var c = 0; c < CFG.MAP_COLS; c++) {
      // 开局除内区外全部废墟（大王定案 2026-09-21 第二批）：空白只来自
      // 3×5 内区、金币/爱心地块（place*Init 只置标记、不动 t）和玩家清理。
      row.push({ t: 'rubble', gold: false, heart: false, harvested: false, b: null });
    }
    GS.grid.push(row);
  }

  // 开局地形（大王定案 2026-09-21）：
  //   ① 内区 3×5（宽 3、高 5，含镇中心）—— 无障碍，全部清为 blank；
  //   ② 外圈：5×7（宽 5、高 7，同一中心）减去内区 —— 全部障碍物（废墟），
  //      保证开局铁轨只能在内区里、且必须先清理才能长出去；
  //   ③ 其余格也全部是废墟（初始空白只保留内区 + 金币地块）。
  var cC = Math.floor(CFG.MAP_COLS / 2);
  var cR = Math.floor(CFG.MAP_ROWS / 2);
  for (var dr2 = -3; dr2 <= 3; dr2++) {
    for (var dc2 = -2; dc2 <= 2; dc2++) {
      if (!CFG.inBounds(cC + dc2, cR + dr2)) continue;
      var inner = Math.abs(dr2) <= 2 && Math.abs(dc2) <= 1;   // 内区 3×5
      GS.grid[cR + dr2][cC + dc2].t = inner ? 'blank' : 'rubble';
    }
  }
  var core = { type: 'core', c: cC, r: cR };
  GS.grid[cR][cC].b = core;
  GS.buildings.push(core);
  GS.core = core;

  // 开局资源格撒点（v1.6.22b 统一规则，大王令"爱心和金币都使用一套规则"）：
  //   先爱心（落点带受限，先放掉）、后金币（全区，后放铺开）；两者共用
  //   `GS._placeResource`（最远点采样 + 最小间距 CFG.RES_GAP），互相拉开不贴身。
  //   放不满会整体重试（见 GS.placeResourceInit）。
  GS.goldTiles = [];
  GS.heartTiles = [];
  GS.placeResourceInit();

  // 列车（v0.9.2）：cargo = 车上堆的金币（规则 6，到站才交付）。
  //   v1.6.22：hearts = 车上堆的爱心数（同款"到站才交付"，交付时回血）。
  //   v1.6.25：picked = **拾取流水**（每次拾取 push 一枚 'gold'|'heart'）——只服务
  //     车头屁股货堆的渲染（renderer.js），**不参与任何数值计算**；cargo / hearts
  //     才是数值权威。到站交付时随 deliver 一并清空（一"圈"一堆）。
  //   站台由 recomputeRails 末尾的 STATION.solve 解出，这里先清空。
  GS.train = { index: 0, frac: 0, cargo: 0, hearts: 0, picked: [] };
  // 交付飘字队列（v1.6.32 大王令"交付时飘字，包括生命和金币"）：**纯表现**，
  //   每条 = { kind:'gold'|'heal', text, x, y, t, ttl }。ENG 生成/衰减、REND 绘制。
  GS.floats = [];
  // 消耗提速（v1.8y 改版：仅抽卡计次）：goldSpent 仅对账用（进度源 = drawCount，
  //   上方已清零）；goldSpent/speedTier 跨波继承、新局清零。
  GS.goldSpent = 0;
  GS.speedTier = 0;
  GS._pendingCoreCalls = [];       // v1.8z 中心播报：弹层挂起的播报队列，新局一并清掉
  // 粒子层（v1.6.43 大王令 B/E：怪死亡特效 + 爆炸视觉共用地基）。**纯表现**：
  //   每枚 = { kind:'ring'|'puff'|'spark', x, y, ... }（画布像素）。ENG 生成/衰减、REND 绘制。
  GS.fx = [];
  GS.station = null;

// ============================================================================
// 铁轨：围绕镇中心、沿「已清空空白区的外轮廓」走一圈的 **单线大环**（欧拉回路版）
// ============================================================================
//
// 【一句话】铁轨就是你把地清成什么样，它就沿着这块地的外边界绕一圈。
//
// --- 几何约定 ---------------------------------------------------------------
//   0) 可铺轨格：已清空为 blank、且不压任何建筑（含镇中心）。
//   1) 主体 U：从镇中心四邻出发、只走可铺轨格做 4 连通洪水。玩家的铁轨只能长在自己
//      清出来的地上，所以 U 就是"你的工地"。
//   2) 削脖子 thinNeck：反复删掉 U 里的 1 格宽通道与死胡同，每轮只保留含镇中心的连通块，
//      结果是"处处至少 2 格宽、且包含镇中心"的那块地。
//      1 格宽的判据 = 「U 邻居恰好 2 个」**且**「删掉它 U 就不连通（割点）」—— 两条缺一不可：
//        · 只看"邻居恰好 2 个" → 会把 2x2 方块里的格误杀（删掉后剩下 3 格照样连通）；
//        · 只看"割点"          → 会把 45° 斜切角误杀（那种格有 4 个 U 邻居，该走十字，属规则 5）。
//   3) 洞 F：不接触地图边界、且不在 U 里的连通块（含镇中心自己那一格、被围住的废墟）。
//      铁轨绕外圈走、不绕内部这些小洞，洞里的废墟格**永远不会**被压上铁轨。
//   4) 外轮廓 B = ∂U：U 里那些"四邻有一个既不在 U 也不在 F（或出界）"的可铺轨格 —— 环的骨架。
//   5) 补格 H：U 内、不是 B、但挨着 B 的可铺轨格。轮廓在"外扩一格 / 收窄一格"的拐点会错开
//      半格，直接连会断链，需要拿它们垫桥。
//   6) 求解：在 A = B ∪ H 上找一条**覆盖 B 格、围住镇中心**的闭合走线：
//        · 主求解（①~④）：闭合迹（= 欧拉回路）—— 每条边最多走一次（= 不许在同一格往返）
//        · 每格度数必为偶数（网格里即 2 或 4）→ 自动排除死端(1) 与丁字(3)
//        · 每格最多访问 2 次（2 次 = 十字）；优先"每格一次"的干净解，无解才放开十字
//        · 先试 0 补格 → 1 补格 → …（补格上限逐级放宽，见 closedTrail 的 hLimit）；
//          容差 tol = 允许放弃的轮廓格数（tol=0 = 必须全覆盖）
//   6b) ⑤ 往返支线（v0.8.0，大王拍板）：主解之后追加一趟**每边 ≤2 次**的闭合走线
//        —— 第 2 次必须与第 1 次反向（= 进去绕一圈原路出来，列车全程朝前开、不倒车）。
//        用途：收编"挂在单条桥边上"的半岛组件（闭合迹数学上围不进它们，只能放弃）。
//        只有覆盖数**严格大于**主解才采纳 —— 无支线机会的盘面零行为变更。见 spurSolver。
//   7) 兜底三级（见 solveWithLadder）：① 容差阶梯 → ② 圈空间精确枚举 → ③ 剥层。
//      完整的推导与实测数据在 docs/设计规格.md §2、docs/铁轨bug诊断-001.md §9。
//
// --- ⚠️ 三个量必须分清（v0.6.18 定案，别再混）--------------------------------
//   讨论铁轨"长短"时，这三个数字经常被混着说，但它们互不相等：
//     · **步数** = GS.railPath 的**序列长度**（含重复经过的格），也就是导出文本里
//                  `rail(N)` 的那个 N。玩家说"铁轨多长"通常指这个。
//     · **格数** = **去重后**的格数（同一格被走两次只算一格）。
//     · **十字** = 环上被走 **≥2 次** 的格数（度数 4 的格）；
//                  其余格都是被走 1 次（度数 2）。
//   恒有关系：步数 ≥ 格数；步数 − 格数 = 十字数（每个十字多走一次）。
//   （v0.8.0 往返支线走线同样满足：每格最多 2 次 ⇒ 多走的步数恰 = 十字数，
//     其中"桥头十字"是 T 岔（度 3）——往返支线引进的新形态，渲染见 renderer.js。）
//   例：大王 2026-09-23 那张盘面，修复前是 **24 步 / 22 格 / 2 十字**，
//       修复后是 **22 步 / 22 格 / 0 十字** —— 格数没变、只是消掉了两个十字。
//   写测试/报 bug 时请**指名是哪一个量**，不要只说"环长/长度"（历史上因这个混过一轮）。
//
// --- 为什么输出永远不会有"斜线"和"重叠" -------------------------------------
//   GS.railPath 始终是一个**有序序列**，列车按它一格一格跑：相邻两格严格正交相邻、
//   首尾相接。十字格只是有 4 条边，自然画出两条交叉的线，不需要任何特殊绘制，
//   也不可能出现非正交的段。
//
// --- 单调性 -----------------------------------------------------------------
//   外轮廓只随"清得更多"而外扩，所以环只会长大。finalRing 里再加一道保险：
//   上一帧的环若仍合法、且**对当前轮廓的覆盖格数**比新解多，才沿用上一帧的环
//   （比较口径是覆盖数而非环长 —— v0.6.4 修订，详见 finalRing 注释）。
//
// --- 十字直行优先（v0.6.10）--------------------------------------------------
//   十字格 = 环里被走过 2 次的格（在环上带 4 条边）。它在环上的"进边 → 出边"
//   配对决定列车是**直穿**还是**拐弯**：旧版配对由 Hierholzer 的取边顺序决定，
//   经常是拐弯，玩家看到的就是"火车在十字路口拐弯"。
//   局部改一处配对必然把单环劈成两个环（数学事实：交换两条出边即分成两环），
//   所以这里对所有十字的配对做**组合枚举**（每个十字 3 种配对，XMAX=6 →
//   最多 3^6 = 729 种），在"仍是单环"的方案里挑拐弯数最少的；全直行能成环就
//   第一次命中（绝大多数盘面）。
//   ⚠️ 环长与格子集合完全不变（同一条边集，只改经过十字时的走法），所以覆盖数、
//      围核心、单调性等性质都不受影响。
// --- 扩张提示 ---------------------------------------------------------------
//   GS.railGrowHints 已整套移除（原实现对每个候选格各跑一遍完整求解器，是重算里最贵的一块）。
//   出口保留为空数组，UI 侧无需改动。
// 两格（a、b）是否经由 x「直行通过」：相对 x 对称 ⇒ 共线穿过（= 对边 / 不拐弯）。
//   相邻格只差 1，所以"坐标差之和为 0"就等价于"方向相反"。
//   ⚠️ 这是**唯一**一处直行判据：straightenRing 的配对打分与 GS.countTurns 的拐弯统计都用它。
function isStraightThrough(a, b, x) {
  return (a.c - x.c) + (b.c - x.c) === 0 && (a.r - x.r) + (b.r - x.r) === 0;
}

GS.straightenRing = function (ring) {
  var L = ring.length, i, j, kk;
  if (L < 4) return ring;
  var keyOf = function (p) { return p.c + ',' + p.r; };

  // ① 找十字：恰好出现 2 次的格；出现 ≥3 次（退化盘面）或没有十字 → 原样返回
  var cnt = {}, cellOf = {};
  for (i = 0; i < L; i++) {
    kk = keyOf(ring[i]);
    cnt[kk] = (cnt[kk] || 0) + 1;
    cellOf[kk] = ring[i];
  }
  var crossKeys = [];
  for (kk in cnt) {
    if (cnt[kk] === 1) continue;
    if (cnt[kk] !== 2) return ring;
    crossKeys.push(kk);
  }
  if (!crossKeys.length) return ring;

  // ② 每个十字的 4 个邻居（环上前一格 / 后一格）；邻居有重复说明格子有回折 → 不动
  var crossNb = {};
  for (i = 0; i < L; i++) {
    var kc = keyOf(ring[i]);
    if (cnt[kc] !== 2) continue;
    (crossNb[kc] || (crossNb[kc] = [])).push(ring[(i + 1) % L], ring[(i - 1 + L) % L]);
  }
  for (j = 0; j < crossKeys.length; j++) {
    var n4 = crossNb[crossKeys[j]], seen = {};
    for (i = 0; i < n4.length; i++) seen[keyOf(n4[i])] = 1;
    if (Object.keys(seen).length !== 4) return ring;
  }

  // ③ 有向边索引（简单图欧拉环：每条有向边唯一）
  var edgeOf = {};
  for (i = 0; i < L; i++) {
    var ek = keyOf(ring[i]) + '>' + keyOf(ring[(i + 1) % L]);
    if (edgeOf[ek] !== undefined) return ring;      // 退化（同向边重复）→ 不动
    edgeOf[ek] = i;
  }

  // ④ 度数 2 的格的固定配对：从 A 进来就从 B 出去
  var basePartner = function () {
    var pm = {};
    for (i = 0; i < L; i++) {
      var k0 = keyOf(ring[i]);
      if (cnt[k0] !== 1) continue;
      var ka = keyOf(ring[(i - 1 + L) % L]), kb = keyOf(ring[(i + 1) % L]);
      if (ka === kb) return null;                   // 退化 → 放弃
      if (!pm[k0]) pm[k0] = {};
      pm[k0][ka] = kb; pm[k0][kb] = ka;
    }
    return pm;
  };
  // 沿配对走一圈，返回走过的边数（不等于 L 就说明劈成了多个环）
  var traceLen = function (pm) {
    var cur = 0, steps = 0, visited = {};
    while (true) {
      if (visited[cur]) return -1;                 // 提前回到起点 → 多环
      visited[cur] = 1;
      var u = keyOf(ring[cur]), v = keyOf(ring[(cur + 1) % L]);
      var out = pm[v] && pm[v][u];
      if (out === undefined) return -1;
      var nx = edgeOf[v + '>' + out];
      if (nx === undefined) return -1;
      cur = nx; steps++;
      if (cur === 0) break;
      if (steps > L) return -1;
    }
    return steps;
  };
  // 直行判定 = 顶层 isStraightThrough（只此一处定义，见其注释）

  // ⑤ 3 种配对：[[0,1],[2,3]] / [[0,2],[1,3]] / [[0,3],[1,2]]，每种得分 = 拐弯对数（0 或 2）
  var PAIRS = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
  var K = crossKeys.length, total = 1;
  for (j = 0; j < K; j++) total *= 3;
  var bestPm = null, bestScore = Infinity;
  for (var combo = 0; combo < total; combo++) {
    var pm0 = basePartner();
    if (!pm0) return ring;
    var sc = 0, t = combo, okCombo = true;
    for (j = 0; j < K && okCombo; j++) {
      var oi = t % 3; t = (t - oi) / 3;
      var ck = crossKeys[j], n4b = crossNb[ck], Xc = cellOf[ck];
      if (!pm0[ck]) pm0[ck] = {};
      for (var q = 0; q < 2; q++) {
        var A = n4b[PAIRS[oi][q][0]], B = n4b[PAIRS[oi][q][1]];
        pm0[ck][keyOf(A)] = keyOf(B);
        pm0[ck][keyOf(B)] = keyOf(A);
        if (!isStraightThrough(A, B, Xc)) sc += 1;  // 这一对是拐弯
      }
      if (sc >= bestScore) okCombo = false;         // 剪枝：已经不如当前最优
    }
    if (!okCombo) continue;
    if (traceLen(pm0) === L) {
      bestScore = sc; bestPm = pm0;
      if (sc === 0) break;                          // 全直行且成单环 → 最优，收工
    }
  }
  if (!bestPm) return ring;                         // 找不到单环方案（极罕见）→ 原样

  // ⑥ 按选定配对重排环序（格子集合、环长不变）
  var seq = [], cur2 = 0, steps2 = 0;
  do {
    seq.push(ring[cur2]);
    var u2 = keyOf(ring[cur2]), v2 = keyOf(ring[(cur2 + 1) % L]);
    cur2 = edgeOf[v2 + '>' + bestPm[v2][u2]];
    steps2++;
  } while (cur2 !== 0 && steps2 <= L);
  return seq.length === L ? seq : ring;
};

// 统计环上"拐弯通过"的次数：只数被走过 ≥2 次的格（十字），
// 每次通行看"进边"与"出边"是否对边（对边 = 直行）。0 = 全程无拐弯。
GS.countTurns = function (ring) {
  if (!ring || ring.length < 4) return 0;
  var L = ring.length, i, cnt = {};
  for (i = 0; i < L; i++) { var k = ring[i].c + ',' + ring[i].r; cnt[k] = (cnt[k] || 0) + 1; }
  var t = 0;
  for (i = 0; i < L; i++) {
    var p = ring[i];
    if (cnt[p.c + ',' + p.r] < 2) continue;
    var a = ring[(i - 1 + L) % L], b = ring[(i + 1) % L];
    if (!isStraightThrough(a, b, p)) t++;
  }
  return t;
};

// ============================================================================
// 求解器工具箱（v2 重构第一步 · 2026-10-11）：原先全部嵌在 recomputeRails
// 函数体内的闭包函数，机械提升为模块级工厂 —— 行为逐格不变（63 用例回归为闸）。
//   ▍为什么要提出来：v2（rail-v2 统一乘子图求解）与 v1 共用同一套几何/区域/搜索
//     原语；嵌套结构下 v2 只能整段复制（项目历史上"同一判据写两份"的病，
//     档案 2.1/代码注释反复警告过口径分叉），工厂化后唯一定义、两路共用。
//   ▍工厂每次 recompute 调用新建一个实例（闭包捕获 COLS/ROWS/core/PROT 当场值，
//     withSize 切尺寸天然兼容），函数体逐字符来自原嵌套实现，未做任何"顺手优化"。
//   ▍RAIL_DC/RAIL_DR 用模块级常量而非裸 DC/DR：避免污染 window 全局名
//     （原先 DC/DR 是 recomputeRails 的函数内 var，提出去若沿用旧名会变成
//     window.DC，与其它脚本的顶层变量有撞名风险）。
// ============================================================================
var RAIL_DC = [1, -1, 0, 0], RAIL_DR = [0, 0, 1, -1];
var RAIL_RANK_CAP = 19;   // 圈空间维数上限（原 RANK_CAP，bestRingExact 用；候选子图 2^19 封顶）

function makeRailSolverKit(COLS, ROWS, coreC, coreR) {
  var N = COLS * ROWS;
  var CORE_C = coreC, CORE_R = coreR;
  var DC = RAIL_DC, DR = RAIL_DR;
  var PROT = null;   // 晚绑定：调用方先建 kit 取 id/inB 铺位图，位图就绪后 setPROT 注入

  function inB(cc, rr) { return CFG.inBounds(cc, rr); }
  function id(cc, rr) { return rr * COLS + cc; }
  // 节点索引 ↔ 行列（热循环里仍手写展开，省一次函数调用）
  function colOf(i) { return i % COLS; }
  function rowOf(i) { return (i - i % COLS) / COLS; }
  // 节点索引序列 → {c,r} 序列（渲染与合法性检查要的口径）
  function ringOf(list) {
    var out = [], i, c;
    for (i = 0; i < list.length; i++) { c = list[i] % COLS; out.push({ c: c, r: (list[i] - c) / COLS }); }
    return out;
  }

  // ======================= 区域求法（原嵌套版逐字迁移） =======================

  // 1) 主体 U：从镇中心四邻出发的 4 连通洪水
  function floodU(um) {
    var U = new Uint8Array(N), st = [], d, nc, nr, q;
    for (d = 0; d < 4; d++) {
      nc = CORE_C + DC[d]; nr = CORE_R + DR[d];
      if (inB(nc, nr) && um[id(nc, nr)]) { q = id(nc, nr); U[q] = 1; st.push(q); }
    }
    // v1.6.7 兜底（§14.7）：镇中心四邻全是塔、起手种子为空时，取候选集的
    // **最大连通分量**作为 U（原语义"含镇中心的那块"已被塔隔断、不存在；
    // 最大块最可能围出含 core 的环——ouxk6f 局 54 环为证）。
    // 只在种子空时激活，正常局零开销。
    if (!st.length) {
      var seenF = new Uint8Array(N), best = null, bestN = 0, s1, dF;
      for (s1 = 0; s1 < N; s1++) {
        if (!um[s1] || seenF[s1]) continue;
        var stF = [s1], comp = [];
        seenF[s1] = 1;
        while (stF.length) {
          var pF = stF.pop(), pcF = colOf(pF), prF = rowOf(pF);
          comp.push(pF);
          for (dF = 0; dF < 4; dF++) {
            var ncF = pcF + DC[dF], nrF = prF + DR[dF];
            if (!inB(ncF, nrF)) continue;
            var qF = id(ncF, nrF);
            if (um[qF] && !seenF[qF]) { seenF[qF] = 1; stF.push(qF); }
          }
        }
        if (comp.length > bestN) { bestN = comp.length; best = comp; }
      }
      if (best) for (s1 = 0; s1 < best.length; s1++) U[best[s1]] = 1;
    }
    while (st.length) {
      var p = st.pop(), pc = colOf(p), pr = rowOf(p);
      for (d = 0; d < 4; d++) {
        nc = pc + DC[d]; nr = pr + DR[d];
        if (!inB(nc, nr)) continue;
        q = id(nc, nr);
        if (um[q] && !U[q]) { U[q] = 1; st.push(q); }
      }
    }
    return U;
  }

  // 2) 洞 F：所有"不接触地图边界、且不在 U 里"的连通块
  function computeF(U) {
    var F = new Uint8Array(N), seen = new Uint8Array(N), s0, comp, st, touch, t, tc, tr, d, nc, nr, q;
    for (s0 = 0; s0 < N; s0++) {
      if (U[s0] || seen[s0]) continue;
      comp = []; st = [s0]; touch = false; seen[s0] = 1;
      while (st.length) {
        t = st.pop(); comp.push(t); tc = colOf(t); tr = rowOf(t);
        for (d = 0; d < 4; d++) {
          nc = tc + DC[d]; nr = tr + DR[d];
          if (!inB(nc, nr)) { touch = true; continue; }
          q = id(nc, nr);
          if (U[q] || seen[q]) continue;
          seen[q] = 1; st.push(q);
        }
      }
      if (!touch) for (t = 0; t < comp.length; t++) F[comp[t]] = 1;
    }
    return F;
  }

  // 3) 剪死胡同：**只数 U 邻居**（洞格不铺轨，不能当成"有出路"）
  function pruneU(U) {
    var del = 0, s0, sc, sr, d, nc, nr, deg;
    for (s0 = 0; s0 < N; s0++) {
      if (!U[s0]) continue;
      sc = colOf(s0); sr = rowOf(s0); deg = 0;
      for (d = 0; d < 4; d++) {
        nc = sc + DC[d]; nr = sr + DR[d];
        if (inB(nc, nr) && U[id(nc, nr)]) deg++;
      }
      if (deg < 2) { U[s0] = 0; del++; }
    }
    return del;
  }

  // 反复「剪死胡同 + 重算洞」直到稳定；返回最终的洞 F
  function normalize(U) {
    var F = computeF(U);
    for (var pass = 0; pass < 30; pass++) {
      var a = pruneU(U), F2 = computeF(U), b = 0, s0;
      for (s0 = 0; s0 < N; s0++) if (F2[s0] !== F[s0]) { F[s0] = F2[s0]; b++; }
      if (!a && !b) break;
    }
    return F;
  }

  // 3b) 只保留"含镇中心"的那块连通区（削脖子后可能有碎片掉队）
  var keepStamp = new Int32Array(N), keepQ = new Int32Array(N), keepCs = 0;
  function keepCoreComponent(U) {
    keepCs++;
    var head = 0, tail = 0, d, q, p, pc, pr, nc, nr, qc, qr;
    for (d = 0; d < 4; d++) {
      nc = CORE_C + DC[d]; nr = CORE_R + DR[d];
      if (!inB(nc, nr)) continue;
      q = id(nc, nr);
      if (U[q] && keepStamp[q] !== keepCs) { keepStamp[q] = keepCs; keepQ[tail++] = q; }
    }
    // v1.6.7 兜底（§14.7）：core 四邻没有 U 格（种子为空）时，保留 U 的**最大连通
    // 分量**——只需把该分量的任一格作种子压入队列，下面的 BFS 自然铺满整块并保留，
    // 其余碎片照旧清除。与 floodU 兜底配套，同样只在盲区激活。
    if (tail === 0) {
      var seenK = new Int32Array(N), bestK = -1, bestN = 0, s2, d2;
      for (s2 = 0; s2 < N; s2++) {
        if (!U[s2] || seenK[s2]) continue;
        var stK = [s2], nK = 0;
        seenK[s2] = 1;
        while (stK.length) {
          var pK = stK.pop(); nK++;
          var pcK = colOf(pK), prK = rowOf(pK);
          for (d2 = 0; d2 < 4; d2++) {
            var ncK = pcK + DC[d2], nrK = prK + DR[d2];
            if (!inB(ncK, nrK)) continue;
            var qK = id(ncK, nrK);
            if (U[qK] && !seenK[qK]) { seenK[qK] = 1; stK.push(qK); }
          }
        }
        if (nK > bestN) { bestN = nK; bestK = s2; }
      }
      if (bestK >= 0) { keepStamp[bestK] = keepCs; keepQ[tail++] = bestK; }
    }
    while (head < tail) {
      p = keepQ[head++]; pc = colOf(p); pr = rowOf(p);
      for (d = 0; d < 4; d++) {
        qc = pc + DC[d]; qr = pr + DR[d];
        if (!inB(qc, qr)) continue;
        q = id(qc, qr);
        if (U[q] && keepStamp[q] !== keepCs) { keepStamp[q] = keepCs; keepQ[tail++] = q; }
      }
    }
    var removed = 0;
    for (var s0 = 0; s0 < N; s0++) {
      if (U[s0] && keepStamp[s0] !== keepCs) { U[s0] = 0; removed++; }
    }
    return removed;
  }

  // 3c) 找 U 里的 1 格宽脖子（判据见 recomputeRails 文件头约定 2）
  var cutStamp = new Int32Array(N), cutQ = new Int32Array(N), cutCs = 0;
  function neckCells(U) {
    var res = [], total = 0, i, s0;
    for (i = 0; i < N; i++) if (U[i]) total++;
    if (total < 4) return res;
    for (s0 = 0; s0 < N; s0++) {
      if (!U[s0] || PROT[s0]) continue;
      var sc = colOf(s0), sr = rowOf(s0), deg = 0, d;
      for (d = 0; d < 4; d++) {
        var nc = sc + DC[d], nr = sr + DR[d];
        if (inB(nc, nr) && U[id(nc, nr)]) deg++;
      }
      if (deg !== 2) continue;                    // 只可能是"一进一出"的单格通道
      var from = -1;
      for (i = 0; i < N; i++) if (U[i] && i !== s0) { from = i; break; }
      if (from < 0) continue;
      cutCs++;
      var head = 0, tail = 0, seen = 0;
      U[s0] = 0;                                  // 试删
      cutStamp[from] = cutCs; cutQ[tail++] = from; seen = 1;
      while (head < tail) {
        var p = cutQ[head++], pc = colOf(p), pr = rowOf(p);
        for (d = 0; d < 4; d++) {
          var qc = pc + DC[d], qr = pr + DR[d];
          if (!inB(qc, qr)) continue;
          var q = id(qc, qr);
          if (!U[q] || cutStamp[q] === cutCs) continue;
          cutStamp[q] = cutCs; cutQ[tail++] = q; seen++;
        }
      }
      U[s0] = 1;                                  // 还原
      if (seen < total - 1) res.push(s0);         // 剩下的没全连通 → 它是脖子
    }
    return res;
  }

  // 3d) 反复削脖子 + 剪死胡同 + 丢弃掉队碎片，直到 U 处处 ≥2 格宽且仍含镇中心
  function thinNeck(U) {
    var totalDel = 0, pass, i;
    for (pass = 0; pass < 20; pass++) {
      var cut = neckCells(U), any = 0;
      for (i = 0; i < cut.length; i++) { U[cut[i]] = 0; any++; }
      var pr = pruneU(U);
      if (!any && !pr) break;
      totalDel += any + pr;
      keepCoreComponent(U);
    }
    return totalDel;
  }

  // 4) 外轮廓 B 与轮廓清单 Bl（清单按索引递增生成 → 天然"最上最左"在前）
  function boundaryOf(U, F, um) {
    var B = new Uint8Array(N), Bl = [], s0, sc, sr, d, nc, nr, q;
    for (s0 = 0; s0 < N; s0++) {
      if (!U[s0] || !um[s0]) continue;
      sc = colOf(s0); sr = rowOf(s0);
      for (d = 0; d < 4; d++) {
        nc = sc + DC[d]; nr = sr + DR[d];
        if (!inB(nc, nr)) { B[s0] = 1; break; }
        q = id(nc, nr);
        if (!U[q] && !F[q]) { B[s0] = 1; break; }
      }
      if (B[s0]) Bl.push(s0);
    }
    return { B: B, Bl: Bl };
  }

  // 5) 候选补格 H（v1.6.9 起铺两层）：第一轮邻轮廓；第二轮邻「轮廓 ∪ 第一轮」。
  //    ⚠️ 第二轮判据是"邻 H1"，绝不能把 H1 本体排除在候选外（历史实验踩过，
  //    右耳圈缺格断成树 ⇒ 端头禁令把 DFS 锁死在起点）。
  function helpersOf(U, B, um) {
    var H = new Uint8Array(N), s0, sc, sr, d, nc, nr, nb;
    for (s0 = 0; s0 < N; s0++) {
      if (!U[s0] || B[s0] || !um[s0]) continue;
      sc = colOf(s0); sr = rowOf(s0); nb = 0;
      for (d = 0; d < 4; d++) {
        nc = sc + DC[d]; nr = sr + DR[d];
        if (inB(nc, nr) && B[id(nc, nr)]) nb++;
      }
      if (nb >= 1) H[s0] = 1;
    }
    // 第二轮：非 B、非 H 的可铺轨格，邻 B 或邻 H 即收入
    var H2 = new Uint8Array(N), s1, sc1, sr1, d1, nc1, nr1, q1;
    for (s1 = 0; s1 < N; s1++) {
      if (!U[s1] || B[s1] || H[s1] || !um[s1]) continue;
      sc1 = colOf(s1); sr1 = rowOf(s1);
      for (d1 = 0; d1 < 4; d1++) {
        nc1 = sc1 + DC[d1]; nr1 = sr1 + DR[d1];
        if (!inB(nc1, nr1)) continue;
        q1 = id(nc1, nr1);
        if (B[q1] || H[q1]) { H2[s1] = 1; break; }
      }
    }
    for (s1 = 0; s1 < N; s1++) if (H2[s1]) H[s1] = 1;
    return H;
  }

  // ======================= 闭环求解（欧拉回路，原嵌套版逐字迁移） =======================
  // gate（v2 新增，第 13 参，缺省 = 旧行为逐分支不变）：端头禁令的"脖子门格"放行开关。
  //   旧禁令：经割边进入孤立边双分量（compIso=1）一律禁——本意是禁"死链"（进去只能
  //   原路折返整条链，链尾必产 deg=1 端头）。但**单点分量挂着环形分量**的脖子格
  //   （如 2×2 半岛的单格脖子：脖子两侧都是桥边、对面是环）是可以"去程穿过、
  //   绕环、回程反穿"的合法通道（该格两次经过、度 4、每边一去一回）——旧禁令
  //   把 P1（规格 §3-O1）要纳入的半岛整个挡死（debug_v2.js 实锤：全档 null、
  //   预算不烧，搜索在根部被剪）。
  //   gate=1 时 treeDead 精化：孤立分量 v 若存在**非孤立分量的邻居**（通向环形
  //   分量 = 脖子门格）→ 放行；纯走廊链（邻居全是孤立分量或无边）→ 仍禁。
  //   gate 缺省（v1 全链调用）时 treeDead ≡ compIso，行为逐分支等价（63 用例为闸）。
  function closedTrail(B, Bl, H, A, budget, hLimit, maxVisit, xmax, tol, startIdx, mm, flip, gate) {
    if (Bl.length < 4) return null;

    // 邻居表预先摊平（每个节点最多 4 个邻居），热循环里不再做取模/越界判断
    var anbr = new Int32Array(N * 4), acnt = new Uint8Array(N);
    var s0, d2;
    for (s0 = 0; s0 < N; s0++) {
      if (!A[s0]) continue;
      var sc = colOf(s0), sr = rowOf(s0), k = 0;
      for (d2 = 0; d2 < 4; d2++) {
        var nc = sc + DC[d2], nr = sr + DR[d2];
        if (!inB(nc, nr)) continue;
        var q = id(nc, nr);
        if (A[q]) anbr[s0 * 4 + k++] = q;
      }
      acnt[s0] = k;
    }

    // 给每条无向边分配一个 id（走边时不重复走同一条边）
    var eidOf = new Int32Array(N * 4);
    for (var z = 0; z < N * 4; z++) eidOf[z] = -1;
    var E = 0;
    for (var u0 = 0; u0 < N; u0++) {
      if (!A[u0]) continue;
      for (var t0 = 0; t0 < acnt[u0]; t0++) {
        var v0 = anbr[u0 * 4 + t0];
        if (v0 < u0) continue;                       // 每条边只分配一次
        eidOf[u0 * 4 + t0] = E;
        for (var t1 = 0; t1 < acnt[v0]; t1++) {
          if (anbr[v0 * 4 + t1] === u0) { eidOf[v0 * 4 + t1] = E; break; }
        }
        E++;
      }
    }

    // ▍桥边表（v0.8.2，仅 mm=2 计算）：Tarjan 边双连通，一次 DFS 标出所有割边。
    //   动机（10:42 盘）：⑤级若把非桥边走两遍，织出的"辫子解"不带来任何额外覆盖
    //   （非桥边两侧本来就有别的路连通），纯费步数。约束"重数 2 的边必须是桥边"
    //   = 支线只准用来收编"挂单桥的半岛"，正是 v0.8.0 立项的初衷。
    //   mm=1 时 isBridge 为 null，热路径零开销（主解行为不变）。
    //   显式栈版（迭代展开，避免深递归）：pe[v] = 进入 v 用的边 id（不走回头边）。
    //   v1.0 端头禁令（大王 2026-09-28 拍板）：顺手给每个点标边双连通分量，
    //   compIso[c]=1 = 该分量是**孤立点**（大小 1 = 无环的"树分量"）。割边对面的
    //   树分量一律禁入 —— 进去只能原路折返整条链，链尾必产 deg=1 端头（尽头车挡），
    //   违背"列车全程朝前"（规则 5 v1.0）。组件含环 ⟺ 分量 ≥2 点 ⟺ compIso=0。
    var isBridge = null, compIso = null, compId = null;
    if (mm === 2) {
      isBridge = new Uint8Array(E);                  // 1 = 桥边（割边）
      compIso = new Uint8Array(N);                   // 1 = 该点所在边双分量是孤立点（无环）
      compId = new Int32Array(N).fill(-1);           // 点 → 边双分量编号（-1 = 未访问块，不判）
      var disc = new Int32Array(N).fill(-1), low = new Int32Array(N), tstamp = 0;
      // 根节点与 dfs 同式取（⚠️ 不能引用下面的 var start —— 它在这块之后才赋值，
      //   提前引用是 undefined，桥边表会全零：0721 盘半岛失收的实锤教训）。
      var rootN = (startIdx >= 0 && startIdx < Bl.length) ? Bl[startIdx] : Bl[0];
      var ptr2 = new Int32Array(N);
      var st2 = [rootN], pe = new Int32Array(N).fill(-1);
      var tstack = [rootN], cid = 0;                 // Tarjan 点栈：弹栈分组即边双分量
      disc[rootN] = low[rootN] = tstamp++;
      while (st2.length) {
        var vn = st2[st2.length - 1];
        var nb = vn * 4, nc2 = acnt[vn], moved = false;
        while (ptr2[vn] < nc2) {
          var ei2 = eidOf[nb + ptr2[vn]];
          if (ei2 < 0) { ptr2[vn]++; continue; }
          var wn = anbr[nb + ptr2[vn]];
          if (ei2 === pe[vn]) { ptr2[vn]++; continue; }         // 不走回头边（重边另算）
          if (disc[wn] >= 0) {
            low[vn] = Math.min(low[vn], disc[wn]);              // 回边
            ptr2[vn]++;
          } else {
            pe[wn] = ei2; disc[wn] = low[wn] = tstamp++;
            tstack.push(wn);
            st2.push(wn); moved = true; break;
          }
        }
        if (!moved) {
          st2.pop();
          if (st2.length) {
            var par = st2[st2.length - 1];
            low[par] = Math.min(low[par], low[vn]);
            if (low[vn] > disc[par]) {
              isBridge[pe[vn]] = 1;                             // 割边判定
              // v1.0：弹出 vn 所在的边双分量（tstack 顶到 vn），仅 1 点 = 树尖/树链点
              var saw = 0;
              while (tstack.length) {
                var tz = tstack.pop();
                compId[tz] = cid; saw++;
                if (tz === vn) break;
              }
              if (saw === 1) compIso[cid] = 1;
              cid++;
            }
          }
        }
      }
      // 残留 tstack = root 所在分量（最后分组）；树的根也落到这里 → size 1 = 孤立
      if (tstack.length) {
        var lastIso = (tstack.length === 1) ? 1 : 0;
        while (tstack.length) compId[tstack.pop()] = cid;
        if (lastIso) compIso[cid] = 1;
      }
      // v2 gate：treeDead[w]=1 才禁入。孤立分量若有"非孤立分量邻居"（脖子门格，
      //   通向环形分量）→ 放行；无 gate 时与 compIso 完全一致（v1 行为不变）。
      var treeDead = compIso;                       // gate 缺省：直接沿用旧判定数组
      if (gate) {
        treeDead = new Uint8Array(N);
        for (var tv = 0; tv < N; tv++) {
          if (!A[tv] || compId[tv] < 0 || !compIso[compId[tv]]) continue;
          var tvc = colOf(tv), tvr = rowOf(tv), open = false;
          for (var td = 0; td < 4 && !open; td++) {
            var tnc = tvc + DC[td], tnr = tvr + DR[td];
            if (!inB(tnc, tnr)) continue;
            var tn = id(tnc, tnr);
            if (A[tn] && compId[tn] >= 0 && !compIso[compId[tn]]) open = true;   // 有环形邻居
          }
          treeDead[tv] = open ? 0 : 1;
        }
      }
    }

    // ▍起点（v0.6.19 可指定）-----------------------------------------------
    //   旧版写死 `Bl[0]`（最上最左的轮廓格），理由是"结果可复现"。
    //   ⚠️ 但那是个真 bug：DFS 先命中先返回，**起点决定它沿哪条路搜** ——
    //      同一档位下其实存在多个解，撞到哪个全看起点。实测大王 2026-09-23 那张盘：
    //      起点 (0,3)/(1,3)/(2,3) → 2 十字；Bl[0]=(2,0) 等 14 个 → 3 十字；其余 25 个 → 4 十字。
    //      ⇒ 写死 Bl[0] 恰好选中了较差的那一类。
    //   现改为 startIdx 参数（Bl 数组下标）：默认仍是 0（保持旧行为），
    //   调用方 `solveOnRegion` 会逐个起点试、按三级字典序择优（见那里的注释）。
    var start = (startIdx >= 0 && startIdx < Bl.length) ? Bl[startIdx] : Bl[0];

    // 边使用模型（v0.8.0）：旧版 usedEdge 布尔 → usedCnt 计数 + dirTo 方向记录。
    //   mm=1 时判据退化为"用过就不能再走"，与旧版逐分支等价（A/B 已验证 0 差异）；
    //   mm=2 时，用过 1 次的边只有从 dirTo（第 1 次的终点）出发才能走第 2 次 —— 天然
    //   保证"第 2 次必与第 1 次反向"，不可能出现同向重走。
    var usedCnt = new Uint8Array(E);
    var dirTo = new Int32Array(E).fill(-1);    // 第 1 次使用的终点节点；-1 = 尚未使用
    var vis = new Uint8Array(N);
    var path = [start];
    vis[start] = 1;
    var needLeft = Bl.length - 1;               // 还没访问的轮廓格数（起点已访问，必在 B 里）
    var helpersUsed = H[start] ? 1 : 0;         // 起点是补格的话也要算进预算
    var twiceUsed = 0;
    var found = null, left = budget.left || 20000, deadline = budget.deadline || 1e15;

    // 剪枝用的两个复用缓冲：stamp 记录"本轮 BFS 访问过"，bfsQ 是队列

    bestCover = m0.cov; bestCross = m0.cross; bestCells = m0.cells;

    // ② 择优：在 k* 档上跑其余起点（si=0 已在 ① 里跑过）。
    //   ▍早停剪枝（v0.6.19 → v1.5 双闸收紧）：**十字 0 且满覆盖**才是字典序理论最优
    //     （①覆盖优先于②十字），两个条件都满足才不必再试剩下的起点。
    //     ⚠️ v1.5 之前只有 `bestCross === 0` 一条闸 —— 1846 盘（2026-10-08 sid 09:46）
    //        关墙钟口径实锤踩中：先命中"覆盖 70、0 十字"即收工，输出覆盖 70 < 满覆盖 72，
    //        违反字典序（真实玩法靠墙钟掐换档位侥幸没踩）。300 求解回合 A/B 实测收紧代价
    //        +0.1%（26748→26783ms、最差 1007→1010ms、超 700ms 盘数不变）——剩余起点
    //        每起点仅烧 0.5~2k 节点 + 墙钟硬闸兜底；输出差异 10/300：覆盖更高 2 / 更低 0。
    //   ▍起点全量（v1.1，大王 2026-09-28 14:48 盘拍板"别挑了，全试"）：
    //     旧 `START_TRIES=9` 是 mm=1 时代的实测拐点（2026-09-23 盘 42 起点只有 3 个能出十字 1）。
    //     mm=2 后解空间方差变大 —— 14:48 盘 36步/十字2 的更优解只在 si=21/23/24/26/28 出现，
    //     9 窗口全错过（择优判据 ringBetter 无罪，纯粹没试到）。201 盘三模式 A/B：
    //     全窗口 better 1 / worse 0 / same 200，均 4.6→4.9ms、最差 71→87ms ——
    //     每起点仅烧 0.5~2k 节点，与"每起点各爬完整阶梯"（15~47 万节点）差两个数量级，放心全试。
    //     "挑好起点排序"已证伪（6 种方位 + 角点优先全追不平或靠 n=1 巧合）。
    var startN = Bl.length;
    for (si = 1; si < startN; si++) {
      if (budget.left < 0) break;
      // ★ 并行分片跳格（v1.6）：GS.__shard={n,k} 时本调用只扫 si≡k (mod n) 的起点。
      //   ①定档（si=0）在所有分片里原样跑 ⇒ k* 各片一致，②的搜索空间按起点划分
      //   互不重叠、并起来恰为全量。shard=null（同步路径/单 worker）时一句不过 ⇒ 零行为变化。
      //   铁闸与早停双闸都在跳格判断之后原样生效。
      if (GS.__shard && si % GS.__shard.n !== GS.__shard.k) continue;
      if (bestCross === 0 && bestCover >= Bl.length) break;   // ★ 早停（v1.5 双闸）：十字 0 且满覆盖
      idx = closedTrail(B, Bl, H, A, budget, hitKi, 1, 0, tol, si, 2) ||
            closedTrail(B, Bl, H, A, budget, hitKi, 2, XMAX, tol, si, 2);
      if (!idx) continue;
      ring = ringOf(idx);
      if (!enclosesCore(ring)) continue;
      var m = ringStats(ring, B);
      if (ringBetter(m, { cov: bestCover, cross: bestCross, cells: bestCells })) {
        bestRing = ring; bestCover = m.cov; bestCross = m.cross; bestCells = m.cells;
      }
    }
    return bestRing;
  }

  // 7) 最后手段兜底：削掉一层外轮廓（受保护格除外）
  //    ⚠️ 它会让 U 朝镇中心收缩、把环越缩越小 —— 这正是旧版"缩圈"的来源，
  //    所以只在「容差阶梯 + 精确枚举」都失败后才启用（见 solveWithLadder）。
  function peelOnce(U, F, um) {
    var bd = boundaryOf(U, F, um), B = bd.B, del = [];
    for (var s0 = 0; s0 < N; s0++) if (B[s0] && !PROT[s0]) del.push(s0);
    for (var m = 0; m < del.length; m++) U[del[m]] = 0;
    return del.length;
  }

  // 6c) ⑤ 往返支线求解器（v0.8.0，大王拍板："允许每边 ≤2 次、桥上双向、列车全程不倒车"）
  //   ▍解决什么：主求解（①~④）的铁轨是闭合迹（每边 ≤1 次），挂在**单条桥边**上的半岛
  //     组件数学上围不进去（进桥出桥是同一条边 = 要走 2 次），只能靠容差放弃。典型：
  //     大王 2026-09-24 07:21 盘，右下 2×3 凸块挂在唯一桥边 (5,8)-(6,8) 上，旧解 rail(12)
  //     放弃 6 格（割集论证见 docs/铁轨bug诊断-001.md）。
  //   ▍数学基础：把"每边 ≤2 次、第 2 次必反向"的闭合走线看成**乘子图**——每条边取重数
  //     1 或 2（重数 2 = 双向各一趟，格网上就是同一段轨道走个来回）。乘子图连通 + 全偶度
  //     ⟺ 存在欧拉回路 ⟺ 列车沿它跑一圈全程朝前、不倒车。支线进出 = 桥边重数 2，
  //     桥头两格各多走一趟 → 必为 2 个十字（渲染成 T 岔贴片，见 renderer.js）。
  //   ▍与主解的关系（无支线盘面零行为变更的三道保险）：
  //     · 现有四级链路一行不动（closedTrail 全部按 mm=1 跑，A/B 验证逐格 0 差异）；
  //     · 主解已盖满轮廓（cov0 ≥ |Bl|）时直接返回 null —— 覆盖数不可能再涨，常规盘面
  //       只花一次 O(N) 的 boundaryOf，零搜索开销；
  //     · 容差卡死 tol = |Bl| − cov0 − 1（封顶 TOL_MAX）：closedTrail 的闭包条件
  //       needLeft ≤ tol 保证**任何搜出来的走线 cov ≥ cov0 + 1**，天然"严格更优才采纳"，
  //       不存在同覆盖换解（那会搅动无支线盘面的既有结果）。
  //   ▍求解配置：maxVisit=2 + mm=2 一步到位（mm=2 下 maxVisit=1 数学上不可能闭合：
  //     折返边的两端各多一趟，端点必被访问 2 次）；补格上限直接给满 hLimitCap
  //     （不爬阶梯 —— "证明低档无解"是指数阶，v0.6.19 两次翻车的教训，这里没有必要）；
  //     多起点 + ringBetter（与主解同一套三级字典序）择优，满覆盖提前收工。
  //   ▍预算：独立墙钟 SPUR_BUDGET_MS=150ms（v0.6.5 "各级预算独立"原则）。它是增益通道
  //     不是保底通道，烧穿 = 保留主解，无正确性风险 —— 所以墙钟可以卡得比①级（700ms）紧。
  //     150 vs 250 实测采纳数相同，见 SPUR_BUDGET_MS 处注释。
  function spurSolver(um, curRing, bud) {
    var __s0 = GS.debugProbe ? Date.now() : 0;
    var reg = makeRegion(um);          // 重造干净区域：④ 剥层会原地改 U，不能用剥过的
    var bd = boundaryOf(reg.U, reg.F, um), B = bd.B, Bl = bd.Bl;
    if (Bl.length < 4) return null;
    var H = helpersOf(reg.U, B, um), A = new Uint8Array(N);
    var s0, hcount = 0;
    for (s0 = 0; s0 < N; s0++) { A[s0] = (B[s0] || H[s0]) ? 1 : 0; if (H[s0]) hcount++; }
    var hLimitCap = hcount < HMAX_CAP ? hcount : HMAX_CAP;
    var cov0 = curRing ? ringStats(curRing, B).cov : -1;
    if (cov0 >= Bl.length) return null;      // 已全覆盖：覆盖数不可能再涨，整趟搜索都省掉
    var tolTop = Bl.length - cov0 - 1;       // 阶梯顶档：任何解出的走线 cov ≥ cov0+1（严格更优才收）
    if (tolTop > TOL_MAX) tolTop = TOL_MAX;
    var best = null, bestSt = null, t, si, idx;
    // v0.9：起点上限放开到全量 Bl（旧 START_TRIES=9 是主解的量，对 spur 不够 ——
    //   五张问题盘的更优解都在 9 名之外的起点上）。
    //   ⚠️ 配套（s241 翻车教训）：预算必须随起点数放大 —— 全量起点 × 旧 150 万节点
    //   会在前几十个起点的"证明无解"上烧干，后面的起点（正解所在）轮不到
    //   （实测 s241：v0.8.4 11ms 找到 cov32，全量起点+旧预算 794ms found=false）。
    //   每起点一份 150 万，放大在**调用点**做（recomputeRails 里 `b.left = 150万 × 40`）；
    //   墙钟仍是硬闸（SPUR_BUDGET_MS = 150ms）。
    var startN = Bl.length;
    // ▍容差阶梯从 0 严格递升（与主解 ① 同哲学；v0.8.0 首版"单档 tolTop+首命中"实测教训）：
    //   有了折返自由后，DFS 的"首命中"解很邋遢 —— 0721 型半岛盘只拿到 cov14（满解是 cov18），
    //   E 型半岛盘甚至在 tolTop 单档上什么都搜不到。改成 t=0,1,…,tolTop 逐档试：
    //   t 档任何解都有 cov ≥ |Bl|−t，**先命中的档覆盖下界最高**；档内跑满多起点按
    //   ringBetter 择优（满覆盖零十字提前收工），命中一档就停（更松的档下界只会更低）。
    //   代价是低档"证明无解"的指数阶
    //   （主解 v0.6.19 两次翻车的同一坑）——由共用预算 + 250ms 墙钟兜底：
    //   烧穿 = 保留主解，无害降级（本级是增益通道，不是保底通道）。
    // ▍v0.9 十字递升阶梯（五张问题盘的根治术）：旧版单档 SPUR_XMAX=8 直接放开，
    //   DFS 生成侧大量产出"带多余十字的脏解"，择优只能在这批脏解里挑（13:16 的 44 步、
    //   13:50 的 36 步、14:28 的 52 步干净解全被埋没；XMAX=2 实验一击命中三张）。
    //   复刻主解"优先干净解"哲学：xcap 从 2 递升到 SPUR_XMAX。
    //   ⚠️ 循环层级（s68/p1022 翻车教训，34~39 秒还 found=false）：**起点在外、
    //     十字档在中、容差档在最内**。旧排法（xcap 最外）会让 x=2 档把全部起点的
    //     "低十字证明无解"指数阶烧完才升档 —— 单个起点 15~47 万节点 × 44 起点，
    //     6000 万预算都扛不住，而正解（某起点 × xcap=8）根本轮不到。
    //     起点在外 = 每个起点自己爬十字阶梯，首命中即该起点最优（与主解"每起点找
    //     自己的最小档"同构——spur 是增益通道，烧穿保留主解，可接受）。
    //   ⚠️ 容差仍卡死 tolTop（任何解 cov ≥ cov0+1 严格更优铁闸不变）。
    for (si = 0; si < startN; si++) {
      if (bud.left < 0) break;
      // ★ 并行分片跳格（v1.6）：与主解②同一把 GS.__shard 旋钮，语义相同。
      //   循环层级（起点外→十字中→容差内）与 v0.9 铁闸 `st.cov <= cov0 continue` 原样不动。
      if (GS.__shard && si % GS.__shard.n !== GS.__shard.k) continue;
      for (var xcap = 2; xcap <= SPUR_XMAX; xcap += 2) {
      for (t = 0; t <= tolTop; t++) {
        if (bud.left < 0) break;
        // v0.9：每档两遍 —— 常规（直行优先）+ flip（拐弯优先）。
        //   ⚠️ 不做"命中即停"早收工：五张问题盘实证，首个命中解常常不是最优
        //   （13:16 的 46 步解在后续起点里）。跑满档×flip，靠 ringBetter 择优，墙钟兜底。
        for (var fp = 0; fp < 2; fp++) {
          idx = closedTrail(B, Bl, H, A, bud, hLimitCap, 2, xcap, t, si, 2, fp === 1);
          if (!idx) continue;
          var ring = ringOf(idx);
          if (!enclosesCore(ring)) continue;
          var st = ringStats(ring, B);
          // ⚠️ v0.9 铁闸（不可拆）：spur 解只有「覆盖 > 主解」才有资格进择优池。
          //   低十字档常先命中"低覆盖干净解"；若放它进池，择优输出时它会把主解的
          //   高覆盖解顶掉（331 盘 A/B 实测 22 盘覆盖回归，s241 cov32→3）。
          //   采纳语义 = 严格更优才替换，一步都不能松。
          if (st.cov <= cov0) continue;
          if (!bestSt || ringBetter(st, bestSt)) { best = ring; bestSt = st; }
        }
      }
      }
    }
    if (GS.debugProbe) GS.debugSpur = { cov0: cov0, blN: Bl.length, tolTop: tolTop,
                                        found: !!best, cov: bestSt ? bestSt.cov : -1,
                                        ms: Date.now() - __s0 };
    return best;
  }

  // 造区域：泛洪 → 削脖子（规则 3）→ 收尾（剪死胡同 + 丢弃掉队碎片）→ 算洞
  function makeRegion(um) {
    var U = floodU(um);
    thinNeck(U);
    keepCoreComponent(U);
    pruneU(U);
    return { U: U, F: normalize(U) };
  }

  // 主求解：四级兜底（v0.6.5 起**各级预算互相独立**，上级烧穿不连坐下级）
  //   ① 容差阶梯：tol=0 先试 —— 与旧版主解**完全一致**（必须覆盖全部轮廓格）；
  //      无解才逐级放宽到 TOL_MAX。它只放宽"覆盖要求"、**不改动区域 U**，
  //      所以给出的环始终围着清空区外沿，不会缩水。
  //   ② 快速兜底（v0.6.5 新增）：阶梯把预算烧穿时走这里。烧穿几乎总是死在"证明更小补格数
  //      不可行"的指数阶上（大图实测：k0..k11 的失败证明 ≈100 万节点，而 k16 的可行解
  //      141 个节点即命中）—— 所以补格数**从大到小**再试一遍，首个命中立即返回。
  //      环可能多垫几格补格，但合法、围核心、尽力全覆盖；只有烧穿的盘面才走到这里。
  //   ③ 精确枚举：阶梯失败 ≠ 真无解（原因见 bestRingExact 注释）。同样不动区域。
  //   ④ 剥层：图上确实不存在围住镇中心的偶度环（或维数超 RANK_CAP）时的最后手段，
  //      此时不剥也是无解，剥了至少还有一条环（不会比 v0.6 更差）。
  //   ⚠️ 旧版（v0.6.1–v0.6.4）②③④ 与 ① **共用同一份预算**：主搜索把 left 烧成负数后，
  //      循环里一句 `return null` 直接放弃整条链 → 铁轨停留旧环不动（用户盘面复现的正是这条链）。
  function solveWithLadder(reg, um, bud) {
    var ring, tol, b;
    for (tol = 0; tol <= TOL_MAX; tol++) {
      if (bud.left < 0) break;                          // 烧穿 → 交给下面几级接手
      ring = solveOnRegion(reg.U, reg.F, um, bud, tol);
      if (ring) return ring;
    }
    if (bud.left < 0) {                                 // ② 快速兜底：补格数从大到小
      var qb = freshBudget(150);
      for (var qt = 0; qt <= TOL_MAX; qt++) {
        ring = solveOnRegion(reg.U, reg.F, um, qb, qt, true);
        if (ring) return ring;
        if (qb.left < 0) break;
      }
    }
    var fb = freshBudget(250);                          // ③④ 共用的独立预算
    ring = bestRingExact(reg.U, reg.F, um, fb);         // ③ 精确枚举
    if (ring) return ring;
    for (b = 0; b < 25; b++) {                          // ④ 剥层
      if (fb.left < 0) break;
      if (!peelOnce(reg.U, reg.F, um)) break;
      keepCoreComponent(reg.U);
      pruneU(reg.U);
      reg.F = normalize(reg.U);
      ring = solveOnRegion(reg.U, reg.F, um, fb, TOL_MAX);
      if (ring) return ring;
    }
    return null;
  }

  // 「不缩水」保险：上一帧的环若仍然合法（每格可铺轨、相邻成环、围住镇中心），且
  // **对当前清空区轮廓的覆盖格数**比新解还多，才沿用旧环。
  // ⚠️ 比较标准必须是「轮廓覆盖数」而不是环长（v0.6.4 修订）：旧环是给更早、更小的清空区算的，
  //    区域长大之后它往往只剩一半轮廓贴合（玩家看到的"铁轨不跟着清空区走"、金币收不到），
  //    但它格式上更长——按长度比就会一直压过更合身的新解。按覆盖数比，新解更贴合时就正常换新；
  //    而剥层兜底给出的"缩水小环"覆盖数必然更低，仍会被旧环压住，反缩水的本意不受影响。
  function finalRing(reg, um, B, prevRing, bud) {
    var ring = solveWithLadder(reg, um, bud), prev = null;
    if (prevRing && prevRing.length >= 4) {
      var okPrev = enclosesCore(prevRing);          // 旧环必须仍围住镇中心（防陈化，见 contourCov 注释）
      if (okPrev) {
        for (var i0 = 0; i0 < prevRing.length; i0++) {
          var pa = prevRing[i0], pb = prevRing[(i0 + 1) % prevRing.length];
          if (!um[id(pa.c, pa.r)] || Math.abs(pa.c - pb.c) + Math.abs(pa.r - pb.r) !== 1) { okPrev = false; break; }
        }
        if (okPrev) prev = prevRing;
      }
    }
    if (prev && (!ring || contourCov(prev, B) > contourCov(ring, B))) ring = prev;
    return ring;
  }
  // ======================= 三、求解 + 输出 =======================

  // 预算：节点 150 万（主约束，实测最差盘面只用约 56 万，留 2.7 倍余量）+ 墙钟安全网。
  // ⚠️ 墙钟必须 ≥ 最差盘面的自然耗时：否则会**先于**节点数触发、把该局面误判为无解；
  //    而且墙钟随机器快慢而变，会造成结果不可复现（200ms 时实测有 2 局被切断）。
  // ▍①级墙钟 400 → 700ms（v0.6.20，大王 2026-09-24 拍板）
  //   起因：多起点择优（v0.6.19）把①级的计算量抬了几倍，400ms 在"起点敏感盘"上会被掐断 ——
  //   大王 2026-09-23 那张盘实测：400/500ms → 十字 3（等于没修）、600ms 临界不稳、
  //   700ms+ 才稳定出十字 1。大王选了这个（流畅性让位于正确性）。
  //   ⚠️ 前面那条"墙钟必须 ≥ 最差盘面自然耗时"的告诫在这里加倍成立：
  //     700ms 已经是"贴合最差自然耗时"的取值，**别再往下调**。
  //   ▍落地后的实测（300 张固定种子盘，真实墙钟，**不设** debugNoDeadline）：
  //       随机盘 200 张：平均 12.0ms / P90 15ms / P95 46ms / P99 397ms / max 484ms
  //       大轮廓盘 100 张：平均 40.4ms / P90 95ms / P99 356ms / max 356ms
  //       ⇒ 被 700ms 掐断 **0 张**。改前的悲观预估是"极端盘 ~0.65s"，实测远小于此 ——
  //         700ms 只抬高了一条几乎碰不到的安全网，日常耗时不变。
  //   ▍要动这个数：先临时写个墙钟量测脚本（照 test_rail.js 的 vm 沙箱加载方式），

  // 墙钟随机器负载波动，重负载下跑测试偶发把求解掐断、结果不可复现（2026-09-21 实测 1/42 次）。
  // GS.debugProbe：测试探针开关（v0.8.0）——置 true 时 recomputeRails 把各阶段耗时写进
  // GS.debugStages（main/exact/spur 的 ms + 支线是否被采纳）与 GS.debugSpur（支线搜索的
  // cov0/|Bl|/tolTop/耗时/是否命中）。只加 Date.now() 与对象赋值，不影响求解结果。

  //   ② 圈空间枚举（bestRingExact）：慢一点但全局最优，已升级为多目标（覆盖 → 十字 → 格数）。

  //   ⚠️ 实测结论（300 张随机盘面 + 穷举交叉验证）：环在十字上的配对**几乎总是唯一**——
  //      能直行的本来就直行，剩下的是"8 字形相切"（直行会把单环劈成两条环），

  GS.contourB = contourB;   // 当前清空区轮廓位图（按格 id 索引）——回归测试用它量「覆盖数」

  //   守卫生效场景：test_rail.js 沙箱不加载 station.js。

  lines.push('|U|=' + cnt(d.U) + '  |B|=' + cnt(d.B) + '  |H|=' + cnt(d.H) +
             '  |半岛加回|=' + cnt(d.pen) + '  |走廊削除|=' + cnt(d.rm));
  lines.push('环: 步数=' + (d.ring ? d.ring.length : 0) + '  cov=' + st.cov + '/' + cnt(d.B) +
             '  重走格=' + st.cross + '  去重格=' + st.cells + '  来源=' + (d.extra.provenance || '?'));
  if (d.extra.note) lines.push(d.extra.note);
  lines.push('');

  if (d.ring) for (var q = 0; q < d.ring.length; q++) railSet[d.ring[q].c + ',' + d.ring[q].r] = 1;
  for (var r = 0; r < ROWS; r++) {

      if (cell.b) ch = cell.b.type === 'core' ? 'C' : 'T';

      else if (d.B && d.B[i]) ch = 'B';
      else if (d.H && d.H[i]) ch = 'h';
      else if (d.pen && d.pen[i]) ch = 'P';
      else if (d.rm && d.rm[i]) ch = 'x';
      else if (d.U && d.U[i]) ch = 'u';
      else ch = cell.t === 'rubble' ? '#' : '.';
      s += ch;
    }
    lines.push(s);
  }

  return lines.join('\n');

  //    干净=命中、脏=可行上界→向下二分找干净档；全脏也定档，让 ③ 的全起点去找干净环）。
  //    ⚠️ 2026-10-12「能满没满」修复轮定稿：**保留本跳步原样**——它是常规盘的快车道，且
  //    跳步点命中都便宜。它有一个已知弱点：会**跨过中间窄可解窗口**（hard78 满覆盖解在
  //    k14，跳步只探 0,1,2,4,8,16；而 k16 是搜索空间膨胀点，硬烧 450 万预算）——该弱点

  //    中间 k12 是 1135 万节点的昂贵无解坑，二分首个探测恰踩坑 → 全链落 peel 只剩 19/45）。

  }
  // ③b 兜底定档（主排程烧穿仍无干净环时触发；reg127 补丁 + 2026-10-12「能满没满」修复）：
  //    独立小预算（150ms / 450 万节点），只在烧穿盘触发（~10%），常规盘零开销。

  //       节点坑，二分首个探测会踩；这类盘由主跳步 ② 直接命中顶档解决（分工明确）。
  if (!main && bud.left < 0) {

        var Aloc = new Uint8Array(N), Blloc = [], mi, mj;

        for (uj = 0; uj < comp2.length; uj++) {

            var idx2 = KIT.closedTrail(Bloc, Bl2, Hloc, Aloc, tierBud, 0, 1, 0, ptol, 0, 2, false, 1) ||

// —— v2 分发（规格 §8.4：默认 v1，开关翻转对 v1 路径零影响）——
GS.__recomputeRailsV1 = GS.recomputeRails;

// ---- 消耗提速（v1.8y 大王拍板 2026-10-21，替换 §14.91 资源点方案；同日改版）------
//   【改版·大王拍板「每次抽卡进度+1、每 4 抽 1 级、最多 8 级」】：进度源 =
//   GS.drawCount（本局已付费抽卡次数），抽满 4 抽跨一档 → 列车永久提速一档
//   （每档 +SPEND_SPEED_STEP，8 档全拿封顶 +80% = 1.8×）。金币金额不再计量——
//   「每抽一卡亮一格」进度条最直白，抽卡是唯一推进行为（大王拍板仅抽卡计次）。
//   · 统一入口 GS.spendGold：扣款 + goldSpent 对账累计 + 按 drawCount 重算档位；
//     造塔（towers.js）走同一入口但不动 drawCount ⇒ 重算幂等、不计进度；
//   · 调用序：ui.js 抽卡**先 drawCount++ 再 spendGold**（顺序颠倒会漏当抽跨档）；
//   · 档位重算式（非增量式）：tier = 满足 drawCount >= 阈值 的档数，天然幂等防漂移；
//   · 消费点：ENG.advanceTrain 乘区 = TRAIN_SPEED × trainSpeedMul(加油站) × spentSpeedMul；
//   · 反馈：跨档瞬间**中心播报**「提速 +X% / 车头攻击 +N」（GS.emitSpeedFloat →
//     GS.coreCall('speed')，锚镇中心格）——v1.8ab 起 **X/N 均为相比上一级的增量** + 常驻镇中心 lv 刻度条 REND.coreLvBar +
//     LOG 'spendSpeedUp'。
//   n 为扣费额；deferFloat=true 时跨档**只挂起不立即播**——抽卡路径专用（大王报
//   「升级之后的提示没有」根因：onSummon 先 spendGold 后 showOffer，立即播的字被
//   随后弹出的 DOM 三选一盖满 1.6s ⇒ 视同没有提示）。挂起后由 ENG.update 每帧
//   GS.flushCoreCalls 在弹层关闭瞬间补播；造塔路径不传（立即播，无遮挡）。
//   兜底：offerOpen 已开时无论是否 defer 都挂起。
GS.spendGold = function (n, deferFloat) {

  GS.gold -= n;
  GS.goldSpent = (GS.goldSpent || 0) + n;
  var tier = 0, i;
  for (i = 0; i < CFG.SPEND_SPEED_TIERS.length; i++)
    if ((GS.drawCount || 0) >= CFG.SPEND_SPEED_TIERS[i]) tier++;
  GS.speedTier = tier;
  if (tier > prevTier) {
    var mul = GS.spentSpeedMul();

      LOG.add('spendSpeedUp', { tier: tier, mul: mul, draws: GS.drawCount, spent: GS.goldSpent });
    GS.emitSpeedFloat(deferFloat);   // 挂起判定统一在 GS.coreCall（defer / 弹层已开）
  }
  return tier;
};
GS.spentSpeedMul = function () {
  var tier = Math.min(GS.speedTier || 0, CFG.SPEND_SPEED_TIERS.length);
  return 1 + CFG.SPEND_SPEED_STEP * tier;
};
// ---- 中心播报（v1.8z 通用方案，抽象自 v1.8y 升级飘字）------------------------
//   任何「在镇中心地标上做一次性事件播报」的反馈统一走 GS.coreCall：
//     · style = 渲染样式键（REND.CORE_STYLE：'speed' 浅蓝 / 'time' 金色），
//       state 侧只管语义与文案，配色/描边全在渲染层；
//     · text 可带 \n 多行（渲染侧分行、统一描边），ttl 不传用 1.2s；

GS.CORE_CALL_TTL = 1.2;
GS._pendingCoreCalls = [];

// 真正入飘字队列（挂起后补播 / 立即播共用）：ENG 未加载或无布局 ⇒ 放弃（返回 false）
GS.emitCoreCall = function (item) {

// 每帧补播检查（ENG.update 调）：弹层还开着就继续等，关掉瞬间全部播完。
GS.flushCoreCalls = function () {

// 升级播报（中心播报的第一个消费者）：文案 **两行块状**（补丁十二·大王令「加换行」）、
//   **格式补丁十三定稿**（大王令「修改提示格式」）：行1 =「提速 +X%」、
//   行2 =「车头攻击 +N」。**v1.8ab 大王令：两行都取「相比上一级的增加值」**——
//   行1 X = mul(tier) − mul(tier−1)（= 每档 +10%，不再显示累计 1.8×）；
//   行2 N = dmg(tier) − dmg(tier−1)（二次曲线下递增 +5/+7/+9…）。
//   目的：每次升级播报回答「这一级涨了多少」，而非重复当前总值。

              (dmgGain ? '\n车头攻击 +' + dmgGain : ''), 2.4, defer);

// 常驻镇中心 lv 刻度条查询（renderer REND.coreLvBar 用）：
//   { tier, lv, ratio, capped } —— lv = 速度等级 = 档数+1（lv1 = 未提速 1×，
//   lv9 = 8 档全拿 1.8×；v1.8y 反馈补丁四·大王拍板「初始 lv1、最多 lv9」）。
//   ratio = 当前档内进度（0~1，封顶时恒 1）= (drawCount − 本档下界)/(下档阈值 − 本档下界)；
//   tier=0 下界为 0（首档 4 抽 ⇒ 每抽 +0.25）。进度源 = 抽卡次数（v1.8y 改版·大王拍板）。

  var hi = capped ? tiers[tiers.length - 1] : tiers[tier];
  var ratio = capped ? 1 : (hi > lo ? (draws - lo) / (hi - lo) : 0);
  return { tier: tier, lv: tier + 1, ratio: Math.max(0, Math.min(1, ratio)), capped: capped };
};

      else if (ch === 'H') { cell.t = 'blank'; cell.heart = true; }
      else if (ch === 'h') cell.heart = true;
      else if (ch === 'C') {

        var ts = tset[c + ',' + r];

        cell.t = 'blank';

        var bt = (ch === 'M') ? 'mint' : (ch === 'F') ? 'gas' : (ch === 'A') ? 'atk' : 'asp';
        var bl = { type: bt, c: c, r: r, flash: 0 };
        cell.b = bl; buildings.push(bl);
      } else if (ch !== '#') {
        return '地图第 ' + (r + 1) + ' 行含不识别字符：' + ch;
      }

  GS.train = { index: (kv.train && kv.train !== '-') ? +kv.train.split(',')[0] : 0,
