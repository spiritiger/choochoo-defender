  { name: '边陲', diff: { count: 1.30, hp: 1.40 }, rows: [
    'hg#####gh',   // 顶角爱心 + 顶缘金币
    '####h####',   // 中轴爱心
    '####g####',   // 中轴金币（中带）
    '#g#####g#',   // 两缘上段金币（中带）
    '###...###',
    'g##...##g',   // 两缘中段金币
    '###.C.###',
    '###...###',
    'g##...##g',   // 两缘下段金币
    '#########',
    '###h#h###',   // 中带：内区正下两侧爱心
    '#########',
    'gg#####gg'    // 底缘：两角金币 + 两侧金币
  ] }
];

// ---- 模式状态（2026-10-18 大王令：**默认关卡制**；跨新局保持，重开不清） -------
//   ⚠️ 放 levels.js 挂 GS 而不进 newGame 重置清单 —— 模式是"元状态"，
//   newGame 负责"这一局"，不负责"玩哪个模式"。test 沙箱只载 state 时兜底 undefined。
//   默认值为 'level' ⇒ main.js 开机直接 GS.startLevel(0)（进游戏即第 1 关）；
//   想玩随机图从工具菜单切「随机模式」（切回后本局内保持，刷新网页回到关卡制）。
if (typeof GS.mode !== 'string') GS.mode = 'level';
if (typeof GS.levelIdx !== 'number') GS.levelIdx = -1;
GS.levelDone = false;                       // 通关旗（newGame/ENG.restart 经 newGame 归零）

// ---- 进度存档（localStorage，全 try/catch 降级） ----------------------------
var _LEVEL_LS_KEY = 'kdg.level.progress';
// ⚠️ 临时全解锁（2026-10-16 大王令"临时帮我解锁 1-5 关的可选择"）：true = 五关全部
//   可选（试玩调参用）。**调试结束请改回 false**，恢复"通关上一关才解锁下一关"。
var LEVEL_UNLOCK_ALL = true;
GS.levelProgress = function () {            // 已通关的最深关（0-based），没通 = -1
  try { var v = localStorage.getItem(_LEVEL_LS_KEY); return (v === null || v === '') ? -1 : +v; }
  catch (e) { return -1; }
};
GS.levelUnlock = function (idx) {           // 通关 idx → 记最深（解锁 idx+1 由 UI 按此推导）
  try {
    if (idx > GS.levelProgress()) localStorage.setItem(_LEVEL_LS_KEY, String(idx));
  } catch (e) { /* 存不了就当会话内进度，不拦通关 */ }
};
GS.levelUnlocked = function (idx) {         // 第 idx 关是否可玩：全解锁开关直通；否则首关恒开、其余须通过关 idx-1
  if (LEVEL_UNLOCK_ALL) return true;
  return idx === 0 || GS.levelProgress() >= idx - 1;
};

// ---- 开局一关（工具菜单/胜利层「下一关」/失败层「重打本关」统一入口） --------
GS.startLevel = function (idx) {
  GS.mode = 'level';
  GS.levelIdx = idx;
  // ① 全量重置（ENG.restart = newGame + TOWERS/FOES.reset + 车头状态归零 + LOG newGame）
  if (typeof ENG !== 'undefined' && ENG.restart) ENG.restart();
  else GS.newGame();                        // 精简沙箱（只载 state 前段）兜底
  // ② 覆盖地形（restart 已在随机图上解过一次开局环，这里重建后再解）
  GS._applyLevelTerrain(LEVELS[idx]);
  if (typeof LOG !== 'undefined') LOG.add('levelStart', { idx: idx, name: LEVELS[idx].name });
};

// 按 ASCII rows 重建 grid / 资源列表 / 铁轨（importMap 同款字符语义的 terrain 子集：
//   关卡表只有地形与资源，不带塔/怪/列车状态 —— 全部由 restart 的新局重置承担）。
GS._applyLevelTerrain = function (lv) {
  var core = GS.core;
  GS.grid = [];
  GS.buildings = [core];
  GS.goldTiles = [];
  GS.heartTiles = [];
  for (var r = 0; r < CFG.MAP_ROWS; r++) {
    var rowS = lv.rows[r];
    var row = [];
    for (var c = 0; c < CFG.MAP_COLS; c++) {
      var cell = { t: 'rubble', gold: false, heart: false, harvested: false, b: null };
      var ch = rowS.charAt(c);
      if (ch === '.') cell.t = 'blank';
      else if (ch === 'g') cell.gold = true;                        // 仍埋废墟（同随机开局）
      else if (ch === 'h') cell.heart = true;
      else if (ch === 'C') { cell.t = 'blank'; cell.b = core; }     // 镇中心（恒 (4,6)）
      // '#' 与其它字符一律废墟（表内不该出现，test_levels 兜字符集校验）
      row.push(cell);
    }
    GS.grid.push(row);
  }
  // 资源块列表从网格标记重建（transport/engine 按列表遍历拾取，与 importMap 同口径）
  for (var rg = 0; rg < CFG.MAP_ROWS; rg++) {
    for (var rc = 0; rc < CFG.MAP_COLS; rc++) {
      if (GS.grid[rg][rc].gold) GS.goldTiles.push({ c: rc, r: rg });
      if (GS.grid[rg][rc].heart) GS.heartTiles.push({ c: rc, r: rg });
    }
  }
  GS.gold = 30;                             // 大王拍板：统一 30 金币（与随机模式一致）
  // 铁轨重解 + 求解缓存全作废（防 skip 闸/异步飞行结果拿旧地形指纹坑新盘）
  GS.__v2cache = null;
  if (typeof SOLVER_ASYNC !== 'undefined' && SOLVER_ASYNC.invalidate) SOLVER_ASYNC.invalidate();
  GS.recomputeRails();
};

</script>
<script>
/* ===== js/resources.js ===== */
// ============================================================================
// resources.js（v1.6.25 从 state.js 切出）—— 资源格（金币 / 爱心）+ 建筑（铸币所 / 加油站）查询
//
//   为什么独立：这些是"资源/建筑规则"，与"铁轨求解器"完全无关的两类代码，
//   原先一起塞在 state.js（3000+ 行）里。搬运时**逐行原样**，只换了宿主文件。
//
//   内容：① 开局资源格撒点统一规则（金币 / 爱心共用最远点采样 + 最小间距）
//         ② 金币价值（含铸币所加成）/ 加油站覆盖查询 / 唯一的"空地"判据 isFreeSpot
//   依赖：CFG / GS。被 state.js 的 newGame、transport.js、engine.js、towers.js 调用。
//   加载序：紧跟 state.js 之后（函数体只在运行时被调，先定义后调用无环）。
// ============================================================================
// ============================================================================
// 开局资源格撒点（金币 / 爱心）—— **一套规则**（v1.6.22b 大王令 2026-10-13：
//   "关于离散分布方面，爱心和金币都使用一套规则。现在这俩有些时候离太近了"）
// ============================================================================
//
// 统一规则 = 「最远点采样 + 最小间距」，金币与爱心**完全同款**：
//   ① 每落一枚先随机抽 K 个候选（落在 band 内、不是资源/建筑、且在 5×7 初始圈之外）；
//   ② 候选须满足**最小间距** `CFG.RES_GAP`（切比雪夫距离 —— 3×3 邻域内不许有第二枚资源）；
//   ③ 在合格候选里取"到**已有全部资源格**（金币 ∪ 爱心）的最近距离"最大者落子。
//   ⇒ 两类资源共用同一个"已落集合"，新资源对金币和爱心**一视同仁地拉开**，不再出现
//      "爱心贴着金币"。间距凑不齐时自动降一档（2 → 1）重试，保证"能放满就放满、不欠数"。
//
// 两者只有两处参数不同（是同一个规则的**参数**，不是两套规则）：
//   · 金币：全区可落（5×7 之外任意格）；爱心：外圈档 = 地图最外一圈、中圈档 = 5×7 之外非外圈。
//   · 数量不同（GOLD_TILES / HEART_TILES）。
//
// 撒放顺序：**先爱心（受限，先放）、后金币（全区，后放）** —— 先把没得选的放掉，
//   金币再用剩余空间铺开，全局更散（反过来会让爱心被金币挤到贴边）。
//
// 为什么要间距：① 两枚资源贴着看着像"一堆"；② 清一块形状会一次挖出好几枚，
//   削弱"往外扩去收资源"的牵引力。规则对两类资源同款 ⇒ 金币之间也不再扎堆。
//
// 每圈结算见 transport.js：金币驶入 +CFG.GOLD_RATE / 爱心 +1 枚，一圈只算一次。

// 到"已有全部资源格（金币 ∪ 爱心）"的最近**切比雪夫**距离（Infinity = 尚无资源）
GS.resourceMinDist = function (c, r) {
  var m = Infinity, i, d;
  for (i = 0; i < GS.goldTiles.length; i++) {
    d = Math.max(Math.abs(c - GS.goldTiles[i].c), Math.abs(r - GS.goldTiles[i].r));
    if (d < m) m = d;
  }
  for (i = 0; i < GS.heartTiles.length; i++) {
    d = Math.max(Math.abs(c - GS.heartTiles[i].c), Math.abs(r - GS.heartTiles[i].r));
    if (d < m) m = d;
  }
  return m;
};

// 单一撒放器 —— 金币与爱心都走这里，这就是"一套规则"。
//   kind='gold'|'heart'；n 枚；band(c,r) 落点带（null = 全区）。
//   gap = **硬**最小间距（切比雪夫）：3×3 邻域内不许有第二枚资源。
//   放不满 n 枚就返回实际枚数（< n），由外层 `GS.placeResourceInit` 决定整体重试。
GS._placeResource = function (kind, n, band, gap) {
  var cC = Math.floor(CFG.MAP_COLS / 2), cR = Math.floor(CFG.MAP_ROWS / 2);
  var cols = CFG.MAP_COLS, rows = CFG.MAP_ROWS;
  var K = 40;                 // 快路径每枚的随机候选抽样数
  var out = (kind === 'gold') ? GS.goldTiles : GS.heartTiles;
  var legal = function (c, r) {
    if (Math.abs(c - cC) <= 2 && Math.abs(r - cR) <= 3) return false;   // 5×7 初始圈内不放
    if (band && !band(c, r)) return false;                              // 落点带
    var cell = GS.grid[r][c];
    return !(cell.gold || cell.heart || cell.b);                        // 同一格不叠放
  };
  // 挑一枚：① 随机抽 K 个，取"到已有资源最近距离"最大者（保留随机铺开的观感）；
  //   ② 抽到的都不合格 → **全场枚举**取最远者（不能只靠抽样："没抽到"会被误判成
  //      "放不下"而提前退让，实测会直接造成贴身）。
  var pick = function () {
    var best = null, bestScore = -1, k, c, r, d;
    for (k = 0; k < K; k++) {
      c = Math.floor(Math.random() * cols);
      r = Math.floor(Math.random() * rows);
      if (!legal(c, r)) continue;
      d = GS.resourceMinDist(c, r);
      if (d < gap) continue;
      if (d > bestScore) { bestScore = d; best = { c: c, r: r }; }
    }
    if (best) return best;
    var tied = [];
    for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
      if (!legal(c, r)) continue;
      d = GS.resourceMinDist(c, r);
      if (d < gap) continue;
      if (d > bestScore) { bestScore = d; tied = [{ c: c, r: r }]; }
      else if (d === bestScore) tied.push({ c: c, r: r });
    }
    return tied.length ? tied[Math.floor(Math.random() * tied.length)] : null;
  };
  var placed = 0;
  while (placed < n) {
    var b = pick();
    if (!b) break;                                  // 该带内已无满足间距的格 → 交外层重试
    var bc = GS.grid[b.r][b.c];
    if (kind === 'gold') bc.gold = true; else bc.heart = true;    // 注意：**不动 t** —— 埋在废墟里
    bc.harvested = false;
    bc.flash = 0;
    out.push({ c: b.c, r: b.r });
    placed++;
  }
  return placed;
};

// 开局撒金币地块（大王定案 2026-09-21；v0.6.12 修订为"初始即障碍物"：t='rubble' + gold=true，
//   要用清理形状清出成空地后才可铺轨/驶入 +CFG.GOLD_RATE）。
//   v1.6.22b 起与爱心共用 `GS._placeResource`（同一套最远点采样 + 最小间距规则）。
GS.placeGoldInit = function (n, gap) {
  if (gap === undefined) gap = CFG.RES_GAP;
  GS.goldTiles = [];
  if (!GS.heartTiles) GS.heartTiles = [];
  return GS._placeResource('gold', n, null, gap);
};

// 开局撒爱心地块（v1.6.22 大王令）：与金币同构的"埋在废墟里的资源格"，但**偏外圈**
//   （大王令"外圈占比更高"，为路径规划分层：想收满必须把轨一路推到地图边）。
//   撒点走 `GS._placeResource`（与金币同一套规则）：先放外圈的 CFG.HEART_OUTER 枚，
//   再放中圈的其余枚。每枚送到站台回血 CFG.HEART_HEAL 点（交付/重置见 transport.js）。
GS.placeHeartInit = function (gap) {
  if (gap === undefined) gap = CFG.RES_GAP;
  var cols = CFG.MAP_COLS, rows = CFG.MAP_ROWS;
  var cC = Math.floor(cols / 2), cR = Math.floor(rows / 2);
  var isOuter = function (c, r) { return c === 0 || c === cols - 1 || r === 0 || r === rows - 1; };
  var isMid = function (c, r) {
    if (Math.abs(c - cC) <= 2 && Math.abs(r - cR) <= 3) return false;   // 5×7 内不放
    return !isOuter(c, r);
  };
  GS.heartTiles = [];
  if (!GS.goldTiles) GS.goldTiles = [];
  var outerN = Math.min(CFG.HEART_OUTER, CFG.HEART_TILES);
  return GS._placeResource('heart', outerN, isOuter, gap) +
         GS._placeResource('heart', CFG.HEART_TILES - outerN, isMid, gap);
};

// 统一撒点入口（newGame 调用）—— 金币 + 爱心一起放，**整体可重试**：
//   要求"两类资源彼此之间、同类之间都 ≥ CFG.RES_GAP（切比雪夫）"；放不满就清空重来，
//   重试 12 次仍不满 → 退到间距 1 兜底（只保证不叠格；300 局实测从未走到这一步）。
//   为什么是"整体重试"而不是"就地降档"：贪心可能把自己走死——该环带上限 26 枚 > 需求 19 枚
//   （行 DP 精确解），换个起点/顺序就放得下；就地降档会让个别盘直接贴身。
GS.placeResourceInit = function () {
  var ok = false;
  for (var attempt = 0; attempt < 12 && !ok; attempt++) {
    GS._clearResources();
    ok = (GS.placeHeartInit() === CFG.HEART_TILES) &&
         (GS.placeGoldInit(CFG.GOLD_TILES) === CFG.GOLD_TILES);
  }
  if (!ok) {
    GS._clearResources();
    GS.placeHeartInit(1);
    GS.placeGoldInit(CFG.GOLD_TILES, 1);
  }
};

// 清空资源格（重试用）：把已落标记从地形上抹掉，两个资源列表也清空
GS._clearResources = function () {
  var i, t;
  for (i = 0; i < GS.goldTiles.length; i++) { t = GS.goldTiles[i]; GS.grid[t.r][t.c].gold = false; }
  for (i = 0; i < GS.heartTiles.length; i++) { t = GS.heartTiles[i]; GS.grid[t.r][t.c].heart = false; }
  GS.goldTiles = [];
  GS.heartTiles = [];
};

// ---- v1.6.23 建筑（铸币所 / 加油站）：唯一的"空地"判据 ----
//   空地 = 已清空空白格 + 无任何建筑 + 非金币格 + 非爱心格 + 非铁轨格。
//   ⚠️ 塔（TOWERS.isFreeSpot）与建筑卡**共用这一条**（唯一定义，别再写第二份）。
GS.isFreeSpot = function (c, r) {
  if (!CFG.inBounds(c, r)) return false;
  var cell = GS.grid[r][c];
  if (cell.t !== 'blank') return false;   // 废墟/障碍不行
  if (cell.b) return false;               // 已有建筑（含塔、镇中心、铸币所、加油站）
  if (cell.gold) return false;            // 金币格 = 资源格，不占用
  if (cell.heart) return false;           // 爱心格 = 资源格，不占用（v1.6.22）
  if (GS.onRail(c, r)) return false;      // 铁轨格不占（列车不做碰撞，视觉重叠即逻辑荒谬）
  return true;
};
// 【铸币所】（v1.8u 大王令改版 §14.82：全场 +5 退役 → 3×3 覆盖金币 +1×座数）
//   旧全场座数查询退役（保留注释不删习惯）：唯一调用方 goldValue 已改 mintCoverAt。
// GS.mintCount = function () {
//   var n = 0;
//   for (var i = 0; i < GS.buildings.length; i++) if (GS.buildings[i].type === 'mint') n++;
//   return n;
// };
// 【铸币所】覆盖 (c,r) 的座数（3×3 ⇒ 切比雪夫 ≤ CFG.MINT_RANGE，与 gasCoverAt 同构）
GS.mintCoverAt = function (c, r) {
  var n = 0;
  for (var i = 0; i < GS.buildings.length; i++) {
    var b = GS.buildings[i];
    if (b.type !== 'mint') continue;
    if (Math.max(Math.abs(b.c - c), Math.abs(b.r - r)) <= CFG.MINT_RANGE) n++;
  }
  return n;
};
// 金币拾取额 = GOLD_RATE × (1 + MINT_BONUS × 覆盖座数)（v1.8u 三拍板枚数口径：
//   覆盖座数是「枚数」乘数 —— 每覆盖一座 +1 枚，覆盖一座该格拾取从 1 枚变 2 枚；
//   金额 = 枚数 × 单枚 GOLD_RATE，覆盖一座 = 5×2 = 10。v1.8u 首版「金额 +1」作废）。
//   无参调用退化为基础价 GOLD_RATE（= 1 枚，兼容旧调用点/显示/测试）。
GS.goldValue = function (c, r) {
  if (c == null) return CFG.GOLD_RATE;
  return CFG.GOLD_RATE * (1 + CFG.MINT_BONUS * GS.mintCoverAt(c, r));
};
// 【加油站】覆盖 (c,r) 的座数（3×3 ⇒ 切比雪夫 ≤ CFG.GAS_RANGE）
GS.gasCoverAt = function (c, r) {
  var n = 0;
  for (var i = 0; i < GS.buildings.length; i++) {
    var b = GS.buildings[i];
    if (b.type !== 'gas') continue;
    if (Math.max(Math.abs(b.c - c), Math.abs(b.r - r)) <= CFG.GAS_RANGE) n++;
  }
  return n;
};
// 【猛攻坊】（v1.8u 十三令，§14.84 大王令）(c,r) 处车厢吃到的攻击加成（小数，1 = +100%）。
//   规则：每座**同行左右邻格**（b.r===r 且 |b.c−c|===1）的猛攻坊 +CFG.AUX_ATK，
//   **求和非连乘**（斜角/隔格不算；一座坊可同惠左右两节，一节车厢可吃多座求和）。
//   ⚠️ 效果是**查询式**（不是落位时写死）：拆/加建筑、铁轨重排自动重算，与加油站同款口径。
//   【原军工厂 GS.wagonAtkBonus/factoryShare 已随十三令退役】
GS.atkBoostAt = function (c, r) {
  var n = 0;
  for (var i = 0; i < GS.buildings.length; i++) {
    var b = GS.buildings[i];
    if (b.type !== 'atk') continue;
    if (b.r === r && Math.abs(b.c - c) === 1) n++;
  }
  return CFG.AUX_ATK * n;
};
// 【疾速坊】（v1.8u 十三令）(c,r) 处车厢吃到的攻速加成（小数，1 = +100%）。
//   每座**同列上下邻格**（b.c===c 且 |b.r−r|===1）的疾速坊 +CFG.AUX_ASP，**求和非连乘**。
//   攻速换算：间隔 = 基础间隔 ÷ (1 + 加成) ⇒ +300% = 间隔 ×1/4（−75%），大王拍板锚点。
GS.aspBoostAt = function (c, r) {
  var n = 0;
  for (var i = 0; i < GS.buildings.length; i++) {
    var b = GS.buildings[i];
    if (b.type !== 'asp') continue;
    if (b.c === c && Math.abs(b.r - r) === 1) n++;
  }
  return CFG.AUX_ASP * n;
};

/* ===== js/cards.js ===== */

//   三类卡：清理形状卡（kind:shape）/ 英雄卡（kind:hero）/ 建筑卡（kind:building）

//   依赖：CFG / GS / TOWERS（英雄元素表，仅运行时读）。
//   加载序：resources.js 之后（函数体只在运行时被调，先定义后调用无环）。
// ============================================================================
// v1.8v（大王令 2026-10-20）：下一抽的价格 = 5 + 5 × 已抽次数
//   （首抽 5 → 10 → 15 → …，无上限封顶；沿革：v1.4.4 首抽 10 / v1.4.8 改 5 /
//   v1.6.15 改回 10 起步步进 10 / 本次改回 5 起步步进 5）。
//   UI 层（按钮文案 / 禁用判断 / 扣费）一律走这里。
GS.drawCost = function () {
  return 5 + 5 * (GS.drawCount || 0);
};

// ---- 三选一：清理形状 + 经济建筑 ----
// v0.6.6：形状随机生成（CFG.randomShape），每张卡自带独立 id，
// 供 UI 高亮/刷新签名用（旧版用 CFG.SHAPES 下标 si，已废）。
GS._cardSeq = 0;
GS.pickShapeCard = function (size) {
  var sh = CFG.randomShape(size);
  return { kind: 'shape', id: ++GS._cardSeq, name: sh.name, cells: sh.cells };
};

// 卡牌去重签名（v0.6.11）：判断"两张卡是不是同一个选项"，也是去重规则的可执行定义。
//   · 形状按**尺寸家族**去重：只看外框两维（小的在前），所以 2×3 和 3×2
//     视为同一形状 —— 大王反馈"偶尔出现三个一样的形状选项"，把旋转也算重。
//   （经济建筑签名 'econ' 随经济建筑退役一并移除；本函数只被形状卡调用。）
GS.cardSig = function (card) {
  var w = 0, h = 0;
  for (var i = 0; i < card.cells.length; i++) {
    if (card.cells[i][0] + 1 > w) w = card.cells[i][0] + 1;
    if (card.cells[i][1] + 1 > h) h = card.cells[i][1] + 1;
  }
  return Math.min(w, h) + 'x' + Math.max(w, h);
};


// ============================================================================
// v1.4 卡牌大改（规格 §14）：新三选一 + 牌库 + 车厢
//   · v1.6.23：三类卡同池 —— 清理形状卡 / 英雄卡 / **建筑卡**（铸币所、加油站）；
//     每张独立概率 CFG 化的 GS.CARD_RATE = 清理 50% / 英雄 35% / 建筑 15%
//     （v1.8v 大王令；沿革 40/35/25）；
//     去重（形状按尺寸家族、英雄按元素、建筑按种类）；
//   · 形状卡进牌库 ≤ GS.DECK_SHAPE_MAX 张（满了该位顺延英雄卡）；

// ============================================================================
GS.DECK_SHAPE_MAX = 3;    // 牌库形状卡上限（大王拍板 ③：一次性消耗、攒≤3）

GS.pickHeroCard = function (elem) {

};

//   · 铸币所 mint：3×3 内被覆盖金币格拾取**枚数** +1/座（多座叠加；v1.8u 三拍板

GS.BUILDINGS = ['mint', 'gas', 'atk', 'asp'];   // v1.8u 十三令：军工厂退役，+猛攻坊/疾速坊
// ⚠️ 卡面文案（v1.6.33 大王令）：**去掉"（可叠加）"字样** —— 卡面只讲"做什么"，

//   GS.atkBoostAt / GS.aspBoostAt），不再往卡面堆说明。别为了"提示完整"又加回来。
GS.BUILDING_INFO = {
  mint:    { name: '铸币所', sub: '覆盖金币 +' + CFG.MINT_BONUS + ' 枚（3×3）' },
  gas:     { name: '加油站', sub: '3×3 内列车提速' },
  atk:     { name: '猛攻坊', sub: '左右车厢攻击 +100%' },
  asp:     { name: '疾速坊', sub: '上下车厢攻速 +100%' }
};
GS.pickBuildingCard = function (bkey) {
  return { kind: 'building', id: ++GS._cardSeq,
           bkey: bkey || GS.BUILDINGS[Math.floor(Math.random() * GS.BUILDINGS.length)] };
};
// （2026-10-15 代码整理：GS.bKey(card) 已删 —— 全项目 0 调用，调用方历来直取
//   card.bkey；清理前版本见 .workbuddy/archive/js-before-code-tidy-20261015/）

// 牌库里形状卡张数
GS.deckShapeCount = function () {
  var n = 0;
  for (var i = 0; i < GS.deck.length; i++) if (GS.deck[i].kind === 'shape') n++;
  return n;
};

// 三类卡的独立出现概率（v1.8v 大王令 50/35/15；沿革 40/35/25）；改动只动这里
GS.CARD_RATE = { shape: 0.50, hero: 0.35, building: 0.15 };
GS.rollCardKind = function () {
  var r = Math.random();
  if (r < GS.CARD_RATE.shape) return 'shape';
  if (r < GS.CARD_RATE.shape + GS.CARD_RATE.hero) return 'hero';
  return 'building';
};

// 三选一发牌（v1.4 起三张独立随机；v1.6.23 加入建筑卡）
//   ▍2026-10-18 大王令：「首次抽卡三选一时，至少有 1 个废墟清理区域」——
//      本局**第一次**发牌时首张强制为清理形状卡（否则三张全英雄/建筑，开局没牌清废墟、
//      扩张断链）。"首次"按**局**计：标记 `GS.__offerSeen` 由 newGame 清零（重开/换关/
//      切模式都重置），发过一轮即置 true，之后按概率正常发牌。
//   去重：形状按尺寸家族 / 英雄按元素 / 建筑按种类；撞重就重抽。
//   ▍v1.8v 大王令：**同类型卡在三选一内最多 2 张**——抽到 3 张同类时**整组重抽**
//      （不用"第三张强制换类"，否则会把概率洗成 37/30/22，偏离 50/35/15 口径）；
//      重抽 20 次仍三连（概率≈3e-16）才兜底把第三张换类。
//   ⚠️ 兜底：建筑有 4 种（v1.8u 十三令起），若长时间撞重（重抽 >30 次）改补**英雄卡**
//      （4 种元素，三张必不撞）——保证一定凑满 3 张，且不写"抽重就重抽整组"的循环；
GS.drawCardOffer = function () {
  var first = !GS.__offerSeen;      // 本局首次发牌：首张保底清理形状卡
  GS.__offerSeen = true;
  var cards = null;
  for (var attempt = 0; attempt < 20; attempt++) {
    cards = [];
    var sigs = {}, guard = 0;
    while (cards.length < 3) {
      guard++;
      var full = GS.deckShapeCount() >= GS.DECK_SHAPE_MAX;   // 形状卡满 → 顺延英雄
      var kind = GS.rollCardKind();
      if (first && cards.length === 0) kind = 'shape';       // 首次三选一：保底一张清理形状
      if (kind === 'shape' && full) kind = 'hero';
      var card, sig;
      if (kind === 'shape') { card = GS.pickShapeCard(); sig = 'shape:' + GS.cardSig(card); }
      else if (kind === 'hero') { card = GS.pickHeroCard(); sig = 'hero:' + card.elem; }
      else { card = GS.pickBuildingCard(); sig = 'bld:' + card.bkey; }
      if (sigs[sig]) {
        if (guard <= 30) continue;
        card = GS.pickHeroCard(); sig = 'hero:' + card.elem; // 兜底顺延英雄
        if (sigs[sig]) continue;
      }
      sigs[sig] = 1;
      cards.push(card);
    }
    var kc = { shape: 0, hero: 0, building: 0 };
    for (var i = 0; i < 3; i++) kc[cards[i].kind]++;
    if (kc.shape <= 2 && kc.hero <= 2 && kc.building <= 2) return cards;   // 同类型 ≤2 张
  }

  var bad = cards[0].kind;
  var alt = bad === 'hero' ? 'building' : 'hero';
  if (alt === 'shape' && GS.deckShapeCount() >= GS.DECK_SHAPE_MAX) alt = 'building';
  cards[2] = alt === 'shape' ? GS.pickShapeCard()
           : alt === 'hero' ? GS.pickHeroCard() : GS.pickBuildingCard();
  return cards;
};

<script>
/* ===== js/station.js ===== */
// ============================================================================
// 站台模块（v0.9.2）—— 与铁轨**叠加**的停靠地块
//
// 大王 2026-09-26 的 6 条规则里，本模块负责规则 1/2/3：
//   1) 与铁轨地块是叠加关系：站台**不占新格、不改地形**，只是从当前铁轨环上
//      挑一个轨格当站台。GS.grid 的 t / gold / b 全都不动。
//   2) 一定位于地图中轴线的靠下位置：中轴列 = floor(MAP_COLS/2)（本图 9 列 → 4），
//      镇中心行 = floor(MAP_ROWS/2)（本图 13 行 → 6）；候选 = 中轴列上、镇中心**以下**
//      的轨格；取其中 **r 最大**（最靠下）的那个。
//   3) 随铁轨位置变化：state.js 的 recomputeRails 每次重算完都会回调
//      STATION.solve(railPath)，于是铁轨一变、站台自动跟着变。
//      GS.station 里带 index（该格在 railPath 的**首次**下标），列车白天对齐它即可。
//
// 规则 4/5（白天停靠 / 夜晚才走）在 engine.js（trainFlow / parkAtStation / advanceTrain），
// 规则 6（金币堆在车上、到站交付）在 transport.js（load / deliver）。
//
// 本模块只依赖 CFG（坐标口径）与 GS（读写 GS.station），不依赖 engine/transport/renderer，
// 可以独立替换选点策略（改 STATION.pick 一处即可）。
// ============================================================================
window.STATION = {};

// 可调参数集中在这里，方便单独调整站台规则而不碰其它模块
STATION.CFG = {
  // 站台行必须 > 镇中心行 + BELOW_CENTER。0 = 严格在镇中心下方（不含镇中心那一行）。
  BELOW_CENTER: 0
};

STATION.axisCol = function () { return Math.floor(CFG.MAP_COLS / 2); };
STATION.centerRow = function () { return Math.floor(CFG.MAP_ROWS / 2); };

// 环上每格的「首次出现下标」—— 十字格会被走两次，站台取第一次，保证 from 站台出发的
// 那一圈从该下标数起刚好是完整一圈。
STATION.firstIndex = function (railPath) {
  var first = {}, i;
  for (i = 0; i < railPath.length; i++) {
    var k = railPath[i].c + ',' + railPath[i].r;
    if (!(k in first)) first[k] = i;
  }
  return first;
};

// 选点：返回 { c, r, index }；铁轨不成环（<4 步）时返回 null。
//   首选：中轴列 + 镇中心以下，r 最大者。
//   退化（该列一个候选都没有）：离地图底部中点曼哈顿距离最近的轨格 ——
//     保证任何盘面都有站台（否则整条昼夜流程会没有到站判定）。
STATION.pick = function (railPath) {
  if (!railPath || railPath.length < 4) return null;
  var first = STATION.firstIndex(railPath);
  var ax = STATION.axisCol();
  var rowMin = STATION.centerRow() + STATION.CFG.BELOW_CENTER;
  var best = null, k;
  for (k in first) {
    var cc = k.split(','), c = +cc[0], r = +cc[1];
    if (c !== ax || r <= rowMin) continue;
    if (!best || r > best.r) best = { c: c, r: r, index: first[k] };
  }
  if (best) return best;
  // 退化口径：离底部中点（中轴列, 最后一行）最近
  var bx = ax, by = CFG.MAP_ROWS - 1;
  for (k in first) {
    cc = k.split(',');
    c = +cc[0]; r = +cc[1];
    var d = Math.abs(c - bx) + Math.abs(r - by);
    if (!best || d < best.d ||
        (d === best.d && (r > best.r || (r === best.r && c < best.c)))) {
      best = { c: c, r: r, index: first[k], d: d };
    }
  }
  if (best) delete best.d;
  return best;
};

// ★ 唯一入口：recomputeRails 算完铁轨后回调本函数，站台随之刷新。
STATION.solve = function (railPath) {
  GS.station = STATION.pick(railPath || GS.railPath || []);
  return GS.station;
};

// 当前站台 { c, r, index } 或 null
STATION.slot = function () { return GS.station || null; };
// 站台在 railPath 上的下标（列车停靠用）；无站台返回 -1
STATION.index = function () { return GS.station ? GS.station.index : -1; };
// 铁轨环上是否已解出站台（列车可发车的前提）
STATION.ready = function () { return !!GS.station && GS.railPath && GS.railPath.length >= 4; };
</script>

TOWERS.randElem = function () {
  return TOWERS.ELEMS[Math.floor(Math.random() * TOWERS.ELEMS.length)];
};

// ---- 放置判定 ---------------------------------------------------------------
// 空地口径（拍板 ⑤）：空地 + 非铁轨 + 非金币格 + 无建筑。铁轨上放塔会堵列车路。
// ⚠️ v1.6.23：判据**上移到 `GS.isFreeSpot`**（塔 / 建筑卡共用一条，别再维护第二份）。
TOWERS.isFreeSpot = function (c, r) { return GS.isFreeSpot(c, r); };

// 全场可放塔的格子列表
TOWERS.freeSpots = function () {
  var out = [];
  for (var r = 0; r < CFG.MAP_ROWS; r++)
    for (var c = 0; c < CFG.MAP_COLS; c++)
      if (TOWERS.isFreeSpot(c, r)) out.push({ c: c, r: r });
  return out;
};

// ---- 放置（召唤与合成的共同底层）--------------------------------------------
// 在 (c,r) 放一座指定 elem/star 的塔。调用方保证格子合法（此处不重复校验，
// 便于合成时"原地替换"不被 isFreeSpot 的 !cell.b 卡住）。
TOWERS.placeAt = function (c, r, elem, star) {
  // affix = 该塔装的词条 id（v1.6.34，**每塔上限 1 条**，见 affixes.js）；wcd = 车厢攻击冷却
  var t = { type: 'tower', elem: elem, star: star, cd: 0, c: c, r: r, flash: 0,
            affix: null, wcd: 0, streak: 0, lastT: null, chargeT: 0 };
  GS.grid[r][c].b = t;
  GS.towers.push(t);
  return t;
};

// 移除塔（合成时源塔离场 / 重开清场用）：格子与数组两处同步清
TOWERS.remove = function (t) {
  var i = GS.towers.indexOf(t);
  if (i >= 0) GS.towers.splice(i, 1);
  var cell = GS.grid[t.r][t.c];
  if (cell.b === t) cell.b = null;
};

// ---- 抽塔（【抽塔】按钮）----------------------------------------------------
// 10 金币 → 随机合法空格 + 随机元素 1 星。成功返回 true，失败返回错误文案。
TOWERS.summon = function () {
  if (GS.gold < TOWERS.CFG.COST) {
    if (typeof LOG !== 'undefined') LOG.add('summonFail', { reason: '金币不足' });
    return '金币不足（需 ' + TOWERS.CFG.COST + '）';
  }
  var spots = TOWERS.freeSpots();
  if (!spots.length) {
    if (typeof LOG !== 'undefined') LOG.add('summonFail', { reason: '没有可用的空地' });
    return '没有可用的空地';
  }
  var p = spots[Math.floor(Math.random() * spots.length)];
  GS.spendGold(TOWERS.CFG.COST);   // v1.8y：统一扣费入口（造塔不计进度——drawCount 不动，重算幂等）
  var t = TOWERS.placeAt(p.c, p.r, TOWERS.randElem(), 1);
  if (typeof LOG !== 'undefined') LOG.add('summon',
    { elem: t.elem, star: t.star, at: p.c + ',' + p.r, cost: TOWERS.CFG.COST });
  return true;
};

// ---- 合成（拖 A 塔放到 B 塔上）----------------------------------------------
// 判据（大王定案）：同名（elem 相同）+ 同星（star 相同）。
// ⚠️ v1.4 改口径（规格 §14.1）：产物**继承原元素** —— 英雄卡时代成长要确定，
//   旧"元素全随机"拍板随 v1.3 随机落点召唤一起退役。
TOWERS.canMerge = function (src, dst) {
  return src && dst && src !== dst &&
         src.type === 'tower' && dst.type === 'tower' &&
         src.elem === dst.elem && src.star === dst.star;
};

TOWERS.merge = function (src, dst) {
  if (!TOWERS.canMerge(src, dst)) {
    if (typeof LOG !== 'undefined') LOG.add('mergeFail',
      { from: src && src.c >= 0 ? (src.c + ',' + src.r) : 'hand', to: dst ? (dst.c + ',' + dst.r) : null });
    return '需要同名同星的两座塔';
  }
  if (src.c >= 0) TOWERS.remove(src);       // 源塔离场（格子弹出、数组移除）
                                            // ⚠️ v1.6.10：手牌虚源（c=-1 占位）不在场，跳过离场
  // v1.4：元素继承不变（删旧 randElem 行）—— 同名卡攒出确定成长
  dst.star += 1;                            // 星级 +1
  dst.flash = 0.4;                          // 合成闪光（renderer 用）
  if (typeof LOG !== 'undefined') LOG.add('merge',
    { from: src.c >= 0 ? (src.c + ',' + src.r) : 'hand', to: dst.c + ',' + dst.r, elem: dst.elem, star: dst.star });
  return true;
};

// ---- 手牌直接合成（v1.6.10，大王令）------------------------------------------
// 英雄卡（手牌塔恒 1 星）拖到场上同名 1 星塔上松手 = 直接升星，免"先建塔再拖动"两步。
// 判据/执行**复用 canMerge/merge 单一路径**（幽灵源 c=-1 占位），杜绝两套口径漂移。
TOWERS.canMergeCard = function (elem, dst) {
  return TOWERS.canMerge({ type: 'tower', elem: elem, star: 1, c: -1, r: -1 }, dst);
};
TOWERS.mergeFromHand = function (elem, dst) {
  return TOWERS.merge({ type: 'tower', elem: elem, star: 1, c: -1, r: -1 }, dst);
};

// ---- 攻击（每帧）------------------------------------------------------------
// ⚠️ v1.4.2 大王纠偏："塔没有攻击能力，车厢才有" —— 塔 = 星级容器（合成升星
//   提升对应车厢），**不再索敌开火**。旧塔攻击循环 `__towerAtk_retired` 已随
//   2026-10-18 死代码清理移除（原文见
//   .workbuddy/archive/retired-code-20261018/removed-code.md）；TOWERS.update
//   现在只维护连线衰减与闪光衰减。
TOWERS.beams = [];    // {ac,ar, bc,br, t}  t = 剩余显示秒（车头/车厢攻击连线共用）

TOWERS.update = function (dt) {
  // 攻击连线闪光衰减（白天也要衰减，残留连线不能冻住）
  for (var b = TOWERS.beams.length - 1; b >= 0; b--) {
    TOWERS.beams[b].t -= dt;
    if (TOWERS.beams[b].t <= 0) TOWERS.beams.splice(b, 1);
  }
  // 塔闪光衰减（合成闪光 renderer 用）—— 攻击 flash 已无来源，衰减照留防残留冻结
  for (var i = 0; i < GS.towers.length; i++) {
    if (GS.towers[i].flash > 0) GS.towers[i].flash -= dt;
  }
};

// 怪被杀（foes.js 调）：hp<=0 的怪由 foes 自己移除，塔这边不用管。

// ---- 重开清场（ENG.init / 失败重开时调）--------------------------------------
TOWERS.reset = function () {
  GS.towers = [];
  TOWERS.beams = [];
};

</script>

window.AFFIXES = {};

AFFIXES.DATA = {

  c3: { tower: 'cannon', name: '弹头分裂', desc: '空中分裂成3颗子弹头，爆破范围扩大。',
        land: '溅射半径 1.3 → 1.65（约 3×3 九格）' },
  c4: { tower: 'cannon', name: '烈焰燃油', desc: '爆炸区产生持续3秒的魔法燃烧地带。',
        land: '爆炸区留 3s 灼烧地带（进入即 0.3×dmg/s）' },

  // ---- ⚡ 闪电 magic ----

  // ---- ❄️ 冰环 ice ----
  i1: { tower: 'ice', name: '深层冻结', desc: '攻击已减速目标有概率使其完全冰冻。',
        land: '对已减速目标命中时 20% 概率冻结（速度 ×0.1，1.5s）' },
  i2: { tower: 'ice', name: '寒流破裂', desc: '命中冰冻怪引发冰爆，使全图减速加深。',

  i3: { tower: 'ice', name: '霜痕路径', desc: '受击怪物身后留下一条减速霜痕地带。',
        land: '受击怪身后留减速地面（该格经过的怪减速 40%，持续 4s）' },
  i4: { tower: 'ice', name: '极寒禁锢', desc: '冰环的伤害和减速作用光环半径扩大。',
        land: '该车厢射程 +0.6 格（2.2 → 2.8），减速时长 +0.5s' },
  i5: { tower: 'ice', name: '冷血追击', desc: '对受控目标伤害倍增，并延长控制时间。',
        land: '对已减速目标伤害 ×1.6，并刷新减速至 2s' }
};

// 词条按塔型分组（渲染角标用）
AFFIXES.BY_TOWER = function (tower) {
  var out = [];
  for (var k in AFFIXES.DATA) if (AFFIXES.DATA[k].tower === tower) out.push(k);
  return out;
};
// 全部 id
AFFIXES.IDS = (function () {
  var a = [];
  for (var k in AFFIXES.DATA) a.push(k);
  return a;
})();

AFFIXES.get = function (id) { return AFFIXES.DATA[id] || null; };

// ---- 全局生效 API（v1.6.36，唯一入口）---------------------------------------
// 玩家是否已获得某条词条（**全局**：一旦获得，场上所有对应塔型的车厢都吃到效果）
GS.hasAffix = function (id) { return !!(GS.playerAffixes && GS.playerAffixes[id]); };

// 获得词条：选中即全局生效（场上所有对应塔型的塔闪一下，作"生效中"反馈）
GS.gainAffix = function (id) {
  var d = AFFIXES.get(id);
  if (!d || GS.hasAffix(id)) return false;
  GS.playerAffixes[id] = 1;
  for (var i = 0; i < GS.towers.length; i++) {
    if (GS.towers[i].elem === d.tower) GS.towers[i].flash = 0.4;
  }
  if (typeof LOG !== 'undefined') LOG.add('affix',
    { id: id, name: d.name, tower: d.tower, global: true });
  return true;
};

// 某塔型已获得的词条数（渲染角标用，≤5）
GS.affixCountOf = function (tower) {
  var list = AFFIXES.BY_TOWER(tower), n = 0;
  for (var i = 0; i < list.length; i++) if (GS.hasAffix(list[i])) n++;
  return n;
};

// 经验满时弹的**三选一（全是词条卡）**。
//   ▍v1.6.36 大王令：「随机时无视场上已有建筑，直接从所有 4 个角色里随机」
//   ⇒ 不再看场上有没有对应塔型，从**全部词条**里纯随机取 3；唯一过滤 = **排除
//   已获得的**（重复获得无效，发了就是废牌）。
GS.drawAffixOffer = function () {
  var pool = [], i;
  for (i = 0; i < AFFIXES.IDS.length; i++) {
    if (!GS.hasAffix(AFFIXES.IDS[i])) pool.push(AFFIXES.IDS[i]);
  }
  for (var k = pool.length - 1; k > 0; k--) {
    var j = Math.floor(Math.random() * (k + 1));
    var tmp = pool[k]; pool[k] = pool[j]; pool[j] = tmp;
  }
  var cards = [];
  for (i = 0; i < 3 && i < pool.length; i++) cards.push(GS.pickAffixCard(pool[i]));
  return cards;
};


// ---- 词条卡（kind:'affix'，只在经验三选一里出现，选中即生效不进牌库）--------
GS.pickAffixCard = function (id) {
  if (!id) id = AFFIXES.IDS[Math.floor(Math.random() * AFFIXES.IDS.length)];
  return { kind: 'affix', id: ++GS._cardSeq, aid: id };
};

<script>
/* ===== js/exp.js ===== */
// ============================================================================
// exp.js（v1.6.34 新建；v1.8u 四拍板改版 §14.83）—— 经验系统（词条的唯一获取途径）
//
//   流程（v1.8u 四拍板 2026-10-19）：
//     夜晚每击杀 1 只怪 → 经验 +killGain（= 本波总经验 CFG.WAVE_EXP[波] / 本波怪数，
//       **波次均分**：波总额按怪数平均分配，总和恰 = 波总额不超发）
//       ▼ 经验满（阈值 = 等级曲线 3500 + (等级-1)×300，等级 = 已得词条数+1；
//         L1→L2 = 3500 … L24→L25 = 10400；**25 级封顶**不再升级）
//     记一次"待发牌"（`GS.expPending++`）→ UI 弹三选一（**全是词条卡**）
//       ▼ 选 1 张进牌库 → 拖到**场上任意一座塔**上松手（见 affixes.js）
//
//   旧口径退役：每怪固定 +1、阈值 10+10×已得词条数（10/20/30…）。
//
//   ⚠️ 状态放 `GS`（`GS.exp` / `GS.expTaken` / `GS.expPending`），与 `GS.drawCount`
//      同款 —— 这样 `GS.newGame`（state.js，加载序在前）能直接重置，不依赖本文件。
//   ⚠️ 发牌只**记数**（`expPending`），真正弹层由 UI 层（main 循环）消费 ——
//      本模块不碰 DOM，保持可测。
//
//   依赖：GS / CFG / FOES（killGain 查波次与怪数）。加载序：affixes.js 之后
//   （发牌用 cards.js 的 pickAffixCard；运行时才查 FOES，加载序无环）。
// ============================================================================
window.EXP = {};

// 波次经验取值：w≤10 取表第 w 项；w>10 封顶取最后一项（关卡模式 10 波全清即胜，
//   无限模式后期按顶格处理）
CFG.waveExp = function (w) {
  var t = CFG.WAVE_EXP;
  return t[Math.min(Math.max(w, 1), t.length) - 1];
};

// 每怪击杀经验 = 本波总经验 / 本波怪数（无状态均分，波内每只相同）
EXP.killGain = function () {
  return CFG.waveExp(FOES.wave) / FOES.CFG.count(FOES.wave);
};

// 升到"第 n+1 条词条"所需经验（n = 已得词条数；等级 = n+1）：
//   3500 + (等级-1)×300 → 3500 / 3800 / … / 10400（L24→L25）；**25 级封顶**（Infinity
//   = 永不满，EXP.add 的 while 自然停摆，不再发牌）
EXP.need = function () {
  var lvl = (GS.expTaken || 0) + 1;
  if (lvl >= 25) return Infinity;
  return 3500 + (lvl - 1) * 300;
};

// 击杀记经验（foes.js 清尸时调 EXP.add(EXP.killGain())）。经验够就消耗并记一次待发牌。
EXP.add = function (n) {
  if (n === undefined) n = 1;
  GS.exp = (GS.exp || 0) + n;
  var guard = 0;
  while (GS.exp >= EXP.need() && guard++ < 999) {
    GS.exp -= EXP.need();
    GS.expTaken = (GS.expTaken || 0) + 1;
    GS.expPending = (GS.expPending || 0) + 1;
  }
  if (typeof LOG !== 'undefined' && guard > 0) LOG.add('expLevel', { taken: GS.expTaken, pending: GS.expPending });
};

// 取走一次待发牌（UI 弹层时调）：返回是否真的取到
EXP.consume = function () {
  if (!(GS.expPending > 0)) return false;
  GS.expPending -= 1;
  return true;
};

// 进度（HUD 经验条用）：{ cur, need }；25 级封顶 → 满条（cur=need=1）
EXP.progress = function () {
  var need = EXP.need();
  if (!isFinite(need)) return { cur: 1, need: 1 };
  return { cur: Math.floor(GS.exp || 0), need: need };
};

// 新局重置（GS.newGame 里直接置字段，这里留一个便利入口给重开链路）
EXP.reset = function () { GS.exp = 0; GS.expTaken = 0; GS.expPending = 0; };

</script>

  gap:   function (w) { return Math.max(0.8, 1.6 - 0.1 * (w - 1)); }, // 逐只间隔秒（v1.6.16 起无消费者，留作历史参数与批数推导参考）

  SEP_PUSH: 0.35     // 每帧修正比例：各退 overlap×0.35/2 —— 柔和收敛不弹开

FOES.wave = 0;        // 已完成的波次号（startWave 后 = 当前正在打的波）
FOES.active = false;  // 本波是否进行中（防止 dusk/白天残留怪被误判）
FOES.pending = 0;     // v1.4.13 节奏刷怪：本波还没放出来的怪数（startWave 置、update 消化）
FOES.spawnCd = 0;     // 距下一次放怪的倒计时秒

//   L1 = 1.00 基准（当前标准难度）、L2~L5 逐关递增；随机模式 / 未开局 / 表缺项恒 1。

FOES.levelMul = function (key) {
  if (typeof GS === 'undefined' || GS.mode !== 'level') return 1;

  var lv = LEVELS[GS.levelIdx];
  if (!lv || !lv.diff || lv.diff[key] == null) return 1;
  return (typeof lv.diff[key] === 'number' && lv.diff[key] > 0) ? lv.diff[key] : 1;

FOES.randEdgePoint = function () {

  var t = Math.random() * (side < 2 ? CFG.MAP_COLS : CFG.MAP_ROWS);

  if (side === 1) return { c: t, r: CFG.MAP_ROWS - 1 + out };

//   · N = min(8, max(3, round(每批数量/3)))——v1.6.62 大王拍板 B 案：点位跟着
//     每批数量走，**恒保持每点每批 ≈3 只**（团密度不随波次涨，治批团纵深吃掉
//     批间隙）；3 起保底、8 封顶。沿革：v1.6.50 min(2+⌊(w-1)/2⌋,5)（2→5 递增）
//     → v1.6.56 min(3+⌊(w-1)/2⌋,6)（3 起 6 封顶）；
//   · 位置 = 地图外 OUT 格的边缘线上**均匀随机**（无偏置），每波重抽；
//   · 点间距 ≥ 3 格（2a）、与上一波点位距离 ≥ 2 格（3a 避重）；
//   · 波内怪数均分到各点（余数随机补）⇒ 预警 ×数量与实际严格守恒。
// 数据流：prepareNext() 生成 GS.nextSpawns（白天布阵预警画它）→ startWave 接管为

FOES.nextPointCount = function (wave) {

  // w4=4、w7=6、w10=8（首次封顶）、w11+ 恒 8。
  return Math.min(8, Math.max(3, Math.round(FOES.CFG.count(wave) / FOES.CFG.BURSTS / 3)));
};
FOES.genSpawns = function (wave, prev) {
  var n = FOES.nextPointCount(wave);
  var pts = [], guard = 0;
  while (pts.length < n && guard++ < 200) {
    var p = FOES.randEdgePoint();
    var ok = true, i;
    for (i = 0; i < pts.length; i++) {                       // 2a：点间 ≥ 3 格
      if (Math.hypot(p.c - pts[i].c, p.r - pts[i].r) < 3) { ok = false; break; }
    }
    if (ok && prev) for (i = 0; i < prev.length; i++) {      // 3a：避上波 ≥ 2 格
      if (Math.hypot(p.c - prev[i].c, p.r - prev[i].r) < 2) { ok = false; break; }
    }
    if (ok) pts.push({ c: p.c, r: p.r, count: 0 });

  while (pts.length < n) {                                   // 兜底：放宽约束补齐（边缘周长 44 格，理论不触发）
    var q = FOES.randEdgePoint();
    pts.push({ c: q.c, r: q.r, count: 0 });

  var total = FOES.CFG.count(wave), base = Math.floor(total / n), rem = total - base * n;

  for (var sh = order.length - 1; sh > 0; sh--) {            // 余数随机分给谁：洗牌定
    var rr = Math.floor(Math.random() * (sh + 1));
    var tmp = order[sh]; order[sh] = order[rr]; order[rr] = tmp;
  }
  for (var k = 0; k < order.length; k++) order[k].count = base + (k < rem ? 1 : 0);

// 生成下一波点位（newGame / 波次结束时调）：wave+1 波、避开 lastSpawns
FOES.prepareNext = function () {
  GS.nextSpawns = FOES.genSpawns(FOES.wave + 1, FOES.lastSpawns);
};

// ---- 放一只怪（v1.4.13 从 startWave 抽出：节奏刷怪每只单独放）----------------
// 落点（v1.6.50 固定刷怪点）：从洗牌出怪队列依序弹出 —— 各点出怪数与白天预警
//   ×数量严格守恒；队列异常为空时兜底随机边缘点（不中断刷怪）。
FOES.spawnOne = function () {
  var p = (FOES.spawnQueue && FOES.spawnQueue.length)
    ? FOES.spawnQueue.shift() : FOES.randEdgePoint();
  var hp = FOES.CFG.hp(FOES.wave);
  var f = { c: p.c, r: p.r };
  // v1.6.55 之 C（大王令"怪物有重叠"）：出生抖动 —— 沿"指向镇心"的切向 ±JITTER
  //   格错开 ⇒ 同点同批怪不同线，配合软分离散开（源头治理）。
  // v1.6.60（大王令"把速度抖动干掉"）：**批内抱团获准**（2026-10-15 需求重述：
  //   批次之间要拉开、批内允许连着），±8% 随机速度（原 f.speedMul = 0.92+rand*0.16）
  //   失去存在意义，只剩"批次拖尾糊开"副作用——拖尾量 ∝ 路程与速度无关，会把
  //   批间距（0.3 格/s × 3s = 0.9 格）吃掉。速度恒 1，属性保留，update 消费处
  //   (f.speedMul || 1) 不动。
  var jdx = GS.core.c - p.c, jdy = GS.core.r - p.r;
  var jl = Math.sqrt(jdx * jdx + jdy * jdy) || 1;
  var off = (Math.random() - 0.5) * 2 * (FOES.CFG.SPAWN.JITTER || 0.4);
  f.c += -jdy / jl * off;
  f.r += jdx / jl * off;
  f.speedMul = 1;       // v1.6.60：恒 1（±8% 抖动退役，沿革见上）
  f.hp = hp; f.maxHp = hp;
  f.speed = FOES.CFG.speed(FOES.wave);
  f.cd = 0;             // 攻击冷却
  // 车厢特效状态计时（v1.4 起：engine 挂 / 这里衰减）。v1.6.34 词条扩容：
  //   slow 普通减速(×0.7) / slowHard 钉刺强减速(×0.15) / freeze 冻结(×0.1)
  //   / mine 地雷减速(×0.3) / zoneSlow 霜痕地带(×0.6，由 i3 霜痕给)
  f.slow = 0;   // burn/poison 计时字段随 v1.8k DoT 退役（塔型特效只剩 slow）
  f.slowHard = 0; f.freeze = 0; f.mine = 0; f.zoneSlow = 0;
